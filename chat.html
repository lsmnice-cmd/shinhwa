  :root{
    --ink:#1a1a1a; --paper:#f4f1ea; --line:#d9d4c8; --line-strong:#2a2a2a;
    --accent:#8a1c1c; --accent-soft:#f3e4e2;
    --ok:#1f6b3a; --ok-soft:#e3f0e7;
    --wait:#9a6a00; --wait-soft:#fbf0d8;
    --muted:#6f6a5d; --panel:#ffffff;
    --mine:#3b3b33; --mine-txt:#f5f2ea;
    --mono:'Consolas','D2Coding','Menlo',monospace;
    --sans:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;
       -webkit-text-size-adjust:100%;overflow:hidden;
       display:flex;flex-direction:column;height:100vh;height:100dvh}

  header.top{position:relative;z-index:50;background:var(--ink);color:#f5f2ea;display:flex;align-items:center;
             gap:10px;padding:9px 14px;border-bottom:3px solid var(--accent)}
  header.top h1{font-size:15px;margin:0;letter-spacing:2px;font-weight:800;white-space:nowrap}
  header.top h1 b{color:#e8b4b0}
  .hbtn{background:transparent;border:1px solid #555;color:#ddd;border-radius:4px;padding:4px 10px;
        font-size:12px;cursor:pointer;font-family:var(--sans);white-space:nowrap}
  .hbtn:hover{border-color:#aaa;color:#fff}
  .status{margin-left:auto;font-size:11px;font-family:var(--mono);opacity:.85;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:#c0392b}
  .dot.on{background:#2ecc71}
  .badge{display:inline-block;min-width:17px;padding:0 5px;border-radius:9px;background:var(--accent);
         color:#fff;font-size:10.5px;font-weight:800;line-height:17px;text-align:center}

  /* ===== 2패널 레이아웃: 모바일 스와이프 / PC 나란히 =====
     #clip(액자)이 화면 크기로 잘라주고, 그 안에서 #wrap(200% 필름)이 좌우로 밉니다.
     필름이 문서 밖으로 삐져나오지 않아 모바일 브라우저가 축소하지 않습니다. */
  #clip{flex:1;min-height:0;overflow:hidden;position:relative}
  #wrap{display:flex;width:200%;height:100%;
        transition:transform .28s cubic-bezier(.25,.7,.3,1)}
  .pane{width:50%;height:100%;display:flex;flex-direction:column;overflow:hidden}
  #wrap.p1{transform:translateX(-50%)}
  .mnav{display:flex;background:#2a2a2a}
  .mnav button{flex:1;padding:8px;background:transparent;border:none;color:#b8b2a4;font-weight:800;
               font-size:13px;cursor:pointer;border-bottom:3px solid transparent;font-family:var(--sans)}
  .mnav button.on{color:#fff;border-bottom-color:var(--accent)}
  @media (min-width:920px){
    #wrap{width:100%;transform:none!important;display:grid;grid-template-columns:1fr 420px}
    .pane{width:auto}
    .mnav{display:none}
    #chatPane{border-right:1px solid var(--line)}
  }

  #wrap.dropping{outline:3px dashed var(--accent);outline-offset:-6px}
  /* 📤 업로드 진행 배너 */
  #upBanner{display:none;position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:420;background:#1a1a1a;color:#fff;
            padding:10px 16px;border-radius:24px;font-size:14px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.35);white-space:nowrap}
  #upBanner.on{display:block}
  #upBanner .bar{display:block;height:4px;background:#444;border-radius:2px;margin-top:6px;overflow:hidden}
  #upBanner .bar i{display:block;height:100%;background:#2fb54a;width:0;transition:width .3s}
  .mbg{display:none;position:fixed;inset:0;z-index:350;background:rgba(0,0,0,.4)}
  .mbg.on{display:flex;align-items:center;justify-content:center;padding:12px}
  .mbox{background:var(--panel);border-radius:12px;width:min(560px,100%);max-height:88vh;overflow:auto;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
  .mbox h3{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
  .mbox h3 button{border:none;background:none;font-size:18px;cursor:pointer}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin:6px 0}
  .kv b{color:var(--muted);font-weight:700}
  .stat{display:flex;gap:8px;margin:8px 0}
  .stat div{flex:1;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
  .stat div span{display:block;font-size:11px;color:var(--muted)} .stat div b{font-size:20px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal .h{text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding:2px}
  .cal .d{min-height:58px;border:1px solid var(--line);border-radius:5px;padding:2px 3px;font-size:10.5px;background:#fff;overflow:hidden}
  .cal .d .n{font-weight:800;font-size:12px} .cal .d.o{background:#f5f2ea;color:#c0bab0} .cal .d.t .n{color:var(--accent)}
  .cal .ev{display:block;background:#e4edf9;color:#1a4f9c;border-radius:3px;padding:0 3px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .cal .ev.auto{background:#e7f2ea;color:#1f6b3a}
  .team-h{font-size:12px;font-weight:800;color:var(--muted);margin:10px 0 2px;border-top:2px dashed var(--line);padding-top:8px}
  /* 👥 직원 목록 · ✅ 할일 */
  #peopleBg,#taskPopBg{display:none;position:fixed;inset:0;z-index:350;background:rgba(0,0,0,.4)}
  #peopleBg.on,#taskPopBg.on{display:flex;align-items:center;justify-content:center;padding:16px}
  #peopleBox,#taskPop{background:var(--panel);border-radius:12px;width:min(440px,100%);max-height:80vh;overflow:auto;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
  .pp-row{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line)}
  .pp-dot{width:10px;height:10px;border-radius:50%;background:#c9c4b8;flex:0 0 auto}
  .pp-dot.on{background:#2fb54a;box-shadow:0 0 0 3px #d7f3dd}
  .pp-name{flex:1;font-weight:700}
  .pp-sub{font-size:11px;color:var(--muted)}
  .pp-row button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 9px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
  .tk{border:1px solid var(--line);border-left:4px solid #1f6b3a;border-radius:8px;background:#fff;padding:9px 11px;margin-bottom:8px}
  .tk.fail{border-left-color:#b23b32;background:#fdf5f4}
  .tk.done{border-left-color:#9a9384;opacity:.7}
  .tk .t{font-size:14px;font-weight:700;white-space:pre-wrap}
  .tk .m{font-size:11px;color:var(--muted);margin-top:3px}
  .tk .b{display:flex;gap:6px;margin-top:7px}
  .tk .b button{border:none;border-radius:6px;padding:7px 12px;font-weight:800;font-size:12.5px;cursor:pointer}
  .tk-sec{font-size:12px;font-weight:800;color:var(--muted);margin:12px 0 6px;padding-top:10px;border-top:2px dashed var(--line)}
  .tk-sec:first-child{border-top:none;padding-top:0;margin-top:4px}
  /* 🖼 사진 크게 보기 */
  #lightbox{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.92);flex-direction:column}
  #lightbox.on{display:flex}
  #lightbox .lb-top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:#fff}
  #lightbox .lb-top a{color:#ddd;font-size:13px;text-decoration:none;border:1px solid #666;border-radius:6px;padding:6px 10px}
  #lightbox .lb-top button{background:#fff;border:none;border-radius:6px;padding:7px 12px;font-weight:800;cursor:pointer}
  #lightbox .lb-body{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;position:relative}
  #lightbox img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-drag:none}
  /* 🚚 배송방 차량 탭·패널 */
  #vehBar{display:none;gap:5px;padding:6px 8px;background:#fff8dc;border-bottom:1px solid #e2d3a8;overflow-x:auto;white-space:nowrap}
  #vehBar.on{display:flex}
  #vehBar button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:5px 12px;font-family:var(--mono);font-weight:800;font-size:13px;cursor:pointer}
  #vehBar button.cur{background:var(--ink);color:#fff}
  #vehPanel{display:none;max-height:45vh;overflow:auto;background:#fffdf7;border-bottom:2px solid var(--line-strong);padding:8px 10px}
  #vehPanel.on{display:block}
  .vp-row{display:flex;gap:8px;padding:6px 4px;border-bottom:1px dashed var(--line);font-size:13px;align-items:flex-start}
  .vp-row .c{min-width:90px;font-weight:800}
  .vp-row .i{flex:1;color:#333}
  .vp-row .s{font-size:11px;white-space:nowrap}
  /* 🗂 방 탭 */
  #roomTabs{display:flex;gap:4px;padding:6px 8px 0;background:#f7f4ec;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
  #roomTabs button{position:relative;border:1px solid var(--line);border-bottom:none;background:#ece8dd;border-radius:8px 8px 0 0;padding:7px 12px;font-size:13px;font-weight:800;cursor:pointer;font-family:var(--sans);color:#6b655a}
  #roomTabs button.cur{background:#fff;color:var(--ink);border-color:var(--line-strong)}
  #roomTabs .badge{display:inline-block;min-width:16px;padding:0 5px;margin-left:5px;background:var(--accent);color:#fff;border-radius:9px;font-size:11px;line-height:16px;text-align:center}
  /* 🔍 검색 */
  #searchBar{display:none;gap:6px;align-items:center;padding:6px 10px;background:#fff8dc;border-bottom:1px solid #e2d3a8}
  #searchBar.on{display:flex}
  #searchBar input{flex:1;min-width:80px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:var(--sans)}
  #searchBar button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 9px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
  #searchBar .cnt{font-size:12px;color:var(--muted);white-space:nowrap}
  .msg-row.hit .bubble{background:#fff3b0 !important;color:var(--ink) !important;box-shadow:0 0 0 2px #e0b800}
  .msg-row.hit .bubble a{color:#1a4f9c !important}
  .bubble{user-select:text;-webkit-user-select:text}
  .msg-row.hit-cur .bubble{box-shadow:0 0 0 3px var(--accent)}
  /* ✅ 체크 스티커 */
  .react-col{display:flex;flex-direction:column;align-items:flex-start;gap:3px;align-self:flex-end;margin:0 4px;max-width:150px}
  .msg-row.mine .react-col{align-items:flex-end}
  .react-list{padding:4px 8px;background:#e7f2ea;border:1px solid #bcd8c5;border-radius:8px;font-size:11px;color:#1f6b3a;line-height:1.5;text-align:left;white-space:nowrap}
  .react-list div span{color:#5a8a66;font-size:10px;margin-left:4px}
  .react{display:inline-flex;align-items:center;gap:3px;margin:3px 0 0;padding:1px 7px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:11px;color:#b8b2a6;cursor:pointer;user-select:none}
  .react b{font-size:11px;color:#1f6b3a} .react i{font-style:normal;font-size:10px;color:#8a857a}
  .react.on{background:#e7f2ea;border-color:#9cc9aa;color:#1f6b3a}
  /* 답장 대상 강조 */
  .msg-row.replying .bubble{outline:2px solid var(--accent);outline-offset:2px}
  /* 꾹 누르기 메뉴 (카톡식) */
  #msgMenuBg{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.35)}
  #msgMenuBg.on{display:block}
  #msgMenu{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(420px,100%);
           background:var(--panel);border-radius:14px 14px 0 0;padding:10px 14px calc(14px + env(safe-area-inset-bottom));
           box-shadow:0 -4px 24px rgba(0,0,0,.25)}
  #msgMenu .mm-prev{font-size:12px;color:var(--muted);padding:6px 4px 10px;border-bottom:1px solid var(--line);
                    margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #msgMenu button{display:block;width:100%;text-align:left;background:none;border:none;padding:13px 8px;
                  font-size:15px;font-weight:700;cursor:pointer;font-family:var(--sans);border-radius:8px}
  #msgMenu button:active{background:#f0ece1}
  #msgMenu .mm-x{color:var(--muted);text-align:center;border-top:1px solid var(--line);margin-top:4px}

  /* ===== 👥 접속인원 바 ===== */
  #presenceBar{display:flex;align-items:center;gap:7px;padding:5px 12px;background:#eae6da;
               border-bottom:1px solid var(--line);font-size:11.5px;color:#5b564a;min-height:29px}
  #presenceBar .names{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #presenceBar b{color:var(--ink)}
  #presenceBar button{border:1px solid #cfc9ba;background:#fff;border-radius:4px;padding:2px 9px;
                      font-size:11px;cursor:pointer;color:#5b564a;white-space:nowrap;font-family:var(--sans)}

  /* ===== 채팅 ===== */
  #chatScroll{flex:1;overflow-y:auto;padding:14px 12px 8px;-webkit-overflow-scrolling:touch}
  .day-sep{text-align:center;margin:14px 0 10px}
  .day-sep span{background:#e5e0d3;color:#5b564a;font-size:11px;font-weight:700;padding:3px 12px;border-radius:12px}
  .msg-row{display:flex;margin-bottom:8px;align-items:flex-end;gap:6px}
  .msg-row.mine{flex-direction:row-reverse}
  .bubble-wrap{max-width:78%;display:flex;flex-direction:column}
  .msg-row.mine .bubble-wrap{align-items:flex-end}
  .m-name{font-size:11px;color:var(--muted);margin:0 4px 2px;font-weight:700}
  .bubble{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;
          padding:8px 11px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;
          box-shadow:0 1px 0 rgba(0,0,0,.04)}
  .msg-row.mine .bubble{background:var(--mine);color:var(--mine-txt);border-color:var(--mine)}
  .m-time{font-size:10px;color:var(--muted);white-space:nowrap;padding-bottom:2px}
  .m-state{font-size:12px;padding-bottom:2px;white-space:nowrap}
  .m-state.parsing{color:var(--wait)}
  .m-state.error{color:var(--accent);font-weight:800}
  .m-state.done{color:var(--ok);font-size:17px;font-weight:800;line-height:1}
  .bubble{cursor:pointer}
  .bubble:active{filter:brightness(.96)}
  .rbtn{background:none;border:none;color:#b5b0a4;font-size:16px;cursor:pointer;padding:4px 6px;
        opacity:0;transition:opacity .15s;align-self:center}
  .msg-row:hover .rbtn{opacity:.9}
  @media (hover:none){ .rbtn{opacity:.7} }
  .quote{border-left:3px solid var(--accent);background:rgba(138,28,28,.06);border-radius:4px;
         padding:4px 8px;font-size:11.5px;color:#6a5c5c;margin-bottom:5px;cursor:pointer;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .msg-row.mine .quote{background:rgba(255,255,255,.12);color:#d8d2c4;border-left-color:#e8b4b0}
  .quote b{font-weight:800}
  .bubble img.ph{display:block;max-width:min(60vw,300px);max-height:300px;border-radius:6px;cursor:pointer;margin:2px 0}

  /* 시스템 메시지 (파싱 결과) */
  .sys-row{display:flex;justify-content:center;margin:2px 0 10px}
  .sys{max-width:88%;background:#fbfaf5;border:1px dashed #c9c2b0;border-radius:8px;padding:7px 12px;
       font-size:12px;line-height:1.6;color:#4a463c;white-space:pre-wrap;word-break:break-word}
  .sys.warn{background:#fff6e6;border-color:#e8c979;color:#7a5a00}
  .sys.err{background:#fdecea;border-color:#e8a9a2;color:#8a1c1c}
  .sys .tag{font-weight:800}

  /* 입력 바 */
  #inputBar{background:var(--panel);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
  #replyBar{display:none;align-items:center;gap:8px;background:#f5f2ea;border:1px solid var(--line);
            border-bottom:none;border-radius:8px 8px 0 0;padding:6px 10px;font-size:12px;color:#5b564a}
  #replyBar.on{display:flex}
  #replyBar .rt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #replyBar button{background:none;border:none;font-size:14px;cursor:pointer;color:var(--muted)}
  .in-row{display:flex;gap:6px;align-items:center}
  #chatInput{flex:1;min-height:44px;max-height:130px;padding:11px 14px;border:1px solid var(--line);
             border-radius:22px;font-family:var(--sans);font-size:16px;line-height:1.4;resize:none;background:#fff;box-shadow:inset 0 1px 2px rgba(0,0,0,.04)}
  #chatInput:focus{outline:none;border-color:var(--accent)}
  .ibtn{width:44px;height:44px;border:none;background:#efece4;border-radius:50%;
        font-size:19px;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  .ibtn:active{background:#e2ddd0}
  #sendBtn{width:auto;min-width:58px;height:44px;background:var(--accent);color:#fff;border:none;font-size:14px;font-weight:800;padding:0 16px;border-radius:22px}
  #sendBtn:disabled{background:#b5b0a4}
  .in-hint{font-size:10.5px;color:#a09a8a;margin-top:4px;text-align:right}

  /* ===== 오른쪽: 미처리 주문 / 확인방 ===== */
  #sidePane{background:#efece3}
  .side-head{display:flex;gap:6px;align-items:center;padding:10px 12px 8px;flex-wrap:wrap}
  .seg{display:flex;background:#e0dbcd;border-radius:7px;padding:3px;gap:3px}
  .seg button{border:none;background:transparent;padding:6px 13px;border-radius:5px;font-weight:800;
              font-size:12.5px;cursor:pointer;color:#6f6a5d;font-family:var(--sans);white-space:nowrap}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
  .datebar2{display:flex;align-items:center;gap:4px;margin-left:auto}
  .datebar2 button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:4px 9px;
                   cursor:pointer;font-weight:800;font-size:13px}
  .datebar2 .cur{font-family:var(--mono);font-weight:800;font-size:13px;padding:0 4px;letter-spacing:1px;cursor:pointer}
  #sideScroll{flex:1;overflow-y:auto;padding:4px 12px calc(90px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  .side-sum{font-size:11.5px;color:var(--muted);padding:2px 2px 8px}

  .veh-h{display:flex;align-items:baseline;gap:8px;margin:12px 2px 6px}
  .veh-h .v{font-family:var(--mono);font-weight:800;font-size:16px;letter-spacing:1px;
            background:#efe9dd;border:1px solid var(--line);border-radius:5px;padding:2px 10px}
  .veh-h .n{font-size:11px;color:var(--muted)}

  .ocard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line-strong);
         border-radius:7px;padding:9px 11px;margin-bottom:8px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
  .ocard.nocli{border-left-color:var(--accent);background:#fdf6f6}
  .ocard.gone{opacity:0;transform:translateX(30px);transition:all .35s}
  .oc-head{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
  .oc-cli{font-weight:800;font-size:14px}
  .oc-cli.warn{color:var(--accent)}
  .oc-meta{font-size:11px;color:var(--muted)}
  .oc-src{margin-left:auto;font-size:10px;color:#a09a8a;cursor:pointer}
  .oc-items{font-size:12.5px;line-height:1.6;color:#333;margin-bottom:7px}
  .oc-items .price{color:var(--accent);font-weight:700}
  .oc-checks{display:flex;gap:4px}
  .chk{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 2px;
       border:1px solid var(--line);border-radius:6px;background:#faf8f2;cursor:pointer;user-select:none;
       font-size:12px;font-weight:800;color:#8a857a;white-space:nowrap}
  .chk input{pointer-events:none;margin:0;width:14px;height:14px;accent-color:var(--ok)}
  .chk.on{background:var(--ok-soft);border-color:#bcd8c5;color:var(--ok)}
  .chk:active{transform:scale(.97)}

  /* 확인방 */
  .ccard{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:9px 11px;margin-bottom:8px}
  .ccard .st{font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px;white-space:nowrap}
  .st.wait{background:#e6eef5;color:#1e4f7a}

<script>
/* ============================================================
   설정 — 주문노트(index.html)와 같은 localStorage 키·기본값을 씁니다.
   주문노트에 로그인해 본 브라우저면 설정이 이미 있고,

const LS='shinwha_note_cfg';
const DEFAULT_FB={
  fbUrl:'https://shinwha-note-default-rtdb.asia-southeast1.firebasedatabase.app',
  fbKey:'AIzaSyD4rYh_bfHjL5ajCf6_IKbA7gRb0CU3MJU',

};
let cfg=JSON.parse(localStorage.getItem(LS)||'{}');
if(!cfg.fbUrl && DEFAULT_FB.fbUrl){ cfg=Object.assign({}, DEFAULT_FB, cfg); }
let db=null, auth=null, ME=null, fbReady=false, IS_ADMIN=false, ALLOWED=false;
let MYNAME='';

let ORDERS={}, MASTER={}, LEARNED={perCustomer:{},global:{}}, ALIASES={}, RECENT={}, PRODBYCODE={};

/* ── 📲 푸시 설정 ─────────────────────────────────────────
   VAPID 키는 채워져 있습니다. 아래 두 값만 Firebase 콘솔에서 복사해 넣으세요:

const PUSH_VAPID='BLuWBs8cLrBPcRgQ8CxlovHnkx0kr2t29kFqzV9uxShoFdVU-eAPKLs5JB_zvcji0KRVmxHjEN5GRISqWOrz63I';

function pushReady(){ return !!(PUSH_SENDER_ID && PUSH_APP_ID && 'serviceWorker' in navigator && window.firebase && firebase.messaging); }

/* ---------- 공용 유틸 (주문노트와 동일 로직) ---------- */
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function todayStr(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function mmdd(d){ return String(d||'').slice(5).replace('-','.'); }
function hhmm(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return p(d.getHours())+':'+p(d.getMinutes()); }
function shortName(name){ return String(name||'').split(/[\(\-]/)[0].trim(); }

let _clientIndex=null;
function buildClientIndex(){
  _clientIndex={};
  for(const c in MASTER){
    const k=cliNorm(c);
    if(!k) continue;
    (_clientIndex[k]=_clientIndex[k]||[]).push(c);
  }
}
function cliNorm(n){
  n=String(n||'');
  n=n.replace(/^[\-\s]+/,'');
  n=n.replace(/^(신규|택배)\s*[-–]?\s*/,'');
  n=n.replace(/\([^)]*\)?/g,'');
  n=n.replace(/[\-–—]\s*(카드|현금|신규).*$/,'');
  n=n.replace(/\(주\)|㈜|주식회사/g,'');
  return n.replace(/[^가-힣A-Za-z0-9]/g,'').toLowerCase();
}
function matchClient(raw){
  if(!_clientIndex) buildClientIndex();
  const rawT=String(raw||'').trim();
  if(rawT && ALIASES[rawT]) return ALIASES[rawT];
  const k=cliNorm(raw);
  if(!k) return shortName(raw);
  for(const a in ALIASES){ if(cliNorm(a)===k) return ALIASES[a]; }
  if(_clientIndex[k]) return _clientIndex[k][0];
  const inner=String(raw).match(/[\(（]([^)）]*)/);
  if(inner){
    const ik=cliNorm(inner[1].replace(/^구[-\s]*/,''));
    if(ik.length>=2 && _clientIndex[ik]) return _clientIndex[ik][0];
  }
  const keys=Object.keys(_clientIndex).sort((a,b)=>b.length-a.length);
  let hit=keys.find(m=>m.length>=3 && k.startsWith(m));
  if(hit) return _clientIndex[hit][0];
  hit=keys.find(m=>k.length>=3 && m.startsWith(k));
  if(hit) return _clientIndex[hit][0];
  return shortName(raw);
}
function learnKey(s){
  return String(s||'').replace(/[\s\d\.\,]+/g,'').replace(/(키로|킬로|kg|KG|Kg|박스|팩|봉지|개|장|줄|판|리|두|마리|덩이|짝)+$/,'').toLowerCase();
}
function correctProduct(client, product, text){
  const key=learnKey(product);
  if(!key) return null;
  const pc=LEARNED.perCustomer[client];
  if(pc){
    if(pc[product]!==undefined) return {item:pc[product], via:'거래처'};
    if(pc[key]!==undefined) return {item:pc[key], via:'거래처'};
  }
  if(LEARNED.global[product]!==undefined) return {item:LEARNED.global[product], via:'공통'};
  if(LEARNED.global[key]!==undefined) return {item:LEARNED.global[key], via:'공통'};
  const cands=recentCandidates(client, product);
  if(cands.length===1) return {item:cands[0].item, via:'최근', cands};
  if(cands.length>1)  return {item:cands[0].item, via:'최근', cands};
  return null;
}
function recentCandidates(client, katok){
  const list=RECENT[client];
  if(!list||!list.length) return [];
  const kw=learnKey(katok);
  if(!kw || kw.length<2) return [];
  const out=[];
  for(const d of list){
    const ik=learnKey(d.item);
    if(!ik) continue;
    if(ik.includes(kw)||kw.includes(ik)) out.push(d);
  }
  out.sort((a,b)=>(b.cnt||0)-(a.cnt||0));
  return out.slice(0,6);
}
function normVeh(v){
  v=String(v||'').trim();
  if(VEH_MERGE[v]) return VEH_MERGE[v];
  return v||'미지정';
}
function matchVehicle(client){
  const m=MASTER[client];
  return m?normVeh(m.vehicle):'';
}
function hashOrder(o){
  const key=(o.date||'')+'|'+(o.client||'')+'|'+(o.items||[]).map(i=>i.text).join('~');
  let h=0;for(let i=0;i<key.length;i++){h=(h*31+key.charCodeAt(i))|0;}
  return 'h'+(h>>>0).toString(36);
}
function dedupKey(date,client,itemText){
  return date+'|'+cliNorm(client)+'|'+String(itemText||'').replace(/\s+/g,'');
}
function itemText(it){ return it.text||it.product||''; }

/* ---------- Apps Script 호출 ---------- */
/* [v3.4] 서버 주소 기본값 — 미승인 신규 직원의 접속 신청(requestAccess)용.
   접속 신청은 서버가 토큰 없이 받아주므로(Code v2.5) 이 주소만으로 충분합니다.
   ※ 배포를 새로 만들어 주소가 바뀌면 이 값도 갱신해 주세요. */
const GS_DEFAULT_URL='https://script.google.com/macros/s/AKfycbyt7vccpdQMOh2eyrk_o81OS_clL3LSenGwj52bmRJ-brtbsun22OEX63DEWTisANGZ/exec';

/* ── 📷 사진 저장 서버 (v3.9) — 용량 많은 계정에 배포한 사진저장_Code.gs
   PHOTO_URL: 그 배포의 /exec 주소, PHOTO_TOKEN: 그 스크립트 속성 PHOTO_TOKEN 값
   둘 다 비우면 기존 방식(주문 서버 계정 드라이브)으로 저장합니다. */
const PHOTO_URL='https://script.google.com/macros/s/AKfycbyUue0ngzFYeQO6_Ya5XutOVFYkpZFr6cNhuYlefcbYSDcCjI2Ibr6RgAeI8ltLiiwl/exec';
const PHOTO_TOKEN='photo2026shinhwa';
async function photoUpload(b64, name, label, roomName){
  if(PHOTO_URL && PHOTO_TOKEN){
    const body=new URLSearchParams({action:'photo', token:PHOTO_TOKEN, data:b64, name:name, by:MYNAME, room:roomName||CUR_ROOM.name, label:label||''});
    const res=await fetch(PHOTO_URL,{method:'POST',body});
    const j=await res.json();
    if(!j.ok) throw new Error(j.error||'사진 서버 오류');
    return j;
  }
  return gsCall('chatPhoto',{data:b64, name:name, by:MYNAME});
}
/* 🏷 이미 올린 파일에 거래처명 붙이기 (파일명 변경) */
function fileLabel(id, label){
  if(!(PHOTO_URL && PHOTO_TOKEN) || !id || !label) return;
  const body=new URLSearchParams({action:'label', token:PHOTO_TOKEN, id:id, label:label});
  fetch(PHOTO_URL,{method:'POST',body}).catch(()=>{});
}
/* 📎 일반 파일 업로드 (PDF·엑셀 등) — 사진 서버가 설정된 경우만 */
async function fileUpload(b64, name, mime, label){
  if(!(PHOTO_URL && PHOTO_TOKEN)) throw new Error('파일 첨부는 사진 서버 설정 후 가능합니다');
  const body=new URLSearchParams({action:'file', token:PHOTO_TOKEN, data:b64, name:name, mime:mime||'application/octet-stream', by:MYNAME, room:CUR_ROOM.name, label:label||''});
  const res=await fetch(PHOTO_URL,{method:'POST',body});
  const j=await res.json();
  if(!j.ok) throw new Error(j.error||'파일 서버 오류');
  return j;
}

async function gsCall(action, payload={}){
  const url=cfg.gsUrl||GS_DEFAULT_URL;
  if(!url) throw new Error('연결 설정이 없습니다 — 주문노트에 한 번 로그인하거나, 관리자에게 문의하세요');
  const body=new URLSearchParams({action, token:cfg.token||'', ...payload});
  const res=await fetch(url,{method:'POST',body});
  if(!res.ok) throw new Error('서버 오류 '+res.status);
  const j=await res.json();
  if(j.error) throw new Error(j.error);
  return j;
}

  if(!cfg.fbUrl||!cfg.fbKey||!cfg.fbProj){
    setStat(false,'설정 필요');
    gateMsgSet('연결 설정이 없습니다. 관리자에게 문의하세요.',false);
    return;
  }
  try{
    if(!firebase.apps.length){
      firebase.initializeApp({
        apiKey:cfg.fbKey, databaseURL:cfg.fbUrl, projectId:cfg.fbProj,
        authDomain:cfg.fbProj+'.firebaseapp.com',
        messagingSenderId:PUSH_SENDER_ID,   // ★ v3.3: 푸시 토큰 발급 필수값
        appId:PUSH_APP_ID
      });
    }
    db=firebase.database();
    auth=firebase.auth();
    // 로그인 유지(LOCAL) 명시 — 브라우저를 닫아도 로그인이 남습니다
    try{ auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{}); }catch(e){}
    // 모바일 redirect 로그인 복귀 결과 수신 (실패 사유 표시)
    try{ auth.getRedirectResult().catch(e=>{
      if(e && e.code!=='auth/no-auth-event') gateMsgSet('로그인 실패: '+e.message,false);
    }); }catch(e){}
    auth.onAuthStateChanged(u=>{
      if(u){ ME=u; clearTimeout(LOGIN_WATCH); try{localStorage.setItem('shinwha_had_login','1');}catch(e){} gateMsgSet('✓ '+(u.email||'')+' 로그인됨 — 서버 연결 중…',true); onSignedIn(u); }
      else { ME=null; fbReady=false; showGate(); setStat(false,'로그아웃됨'); }
    });
    // 📲 푸시 수신기(서비스워커) 등록 — 설정값을 주소로 넘겨줌
    if(pushReady()){
      navigator.serviceWorker.register('firebase-messaging-sw.js?key='+encodeURIComponent(cfg.fbKey)
        +'&pid='+encodeURIComponent(cfg.fbProj)+'&sid='+encodeURIComponent(PUSH_SENDER_ID)
        +'&aid='+encodeURIComponent(PUSH_APP_ID))
        .then(r=>{ SW_REG=r; })
        .catch(e=>{ SW_REG_ERR=String(e&&e.message||e); console.warn('SW 등록 실패', e); });
    }
    setStat(false,'로그인 필요');
    gateMsgSet('로그인 상태 확인 중…',true);
    setTimeout(()=>{
      if(ME) return;
      // 전에 로그인한 적이 있는데 지금 없다 = 브라우저가 로그인 저장을 지운 것
      if(localStorage.getItem('shinwha_had_login')==='1'){
        gateMsgSet('이전 로그인이 저장되지 않았습니다.\n· 크롬 설정 → 개인정보 보호에 "종료 시 인터넷 사용 기록/쿠키 삭제"가 켜져 있으면 꺼주세요\n· 시크릿 모드에서는 로그인이 유지되지 않습니다\n· 사이트 설정에서 이 사이트의 쿠키가 차단되어 있지 않은지 확인하세요',false);
      }else gateMsgSet('',true);
    }, 2500);
  }catch(e){setStat(false,'연결 오류');gateMsgSet('연결 오류: '+e.message,false);console.error(e);}
}
function isIOS(){
  const ua=navigator.userAgent||'';
  return /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints>1);
}
let LOGIN_WATCH=null;
function loginWatchdog(){
  clearTimeout(LOGIN_WATCH);
  LOGIN_WATCH=setTimeout(()=>{
    if(ME) return;
    // 몇 초가 지나도 로그인이 안 됨 = 팝업이 소리 없이 차단된 것 (아이폰 사파리 기본값)
    let msg='로그인 창이 뜨지 않았다면 팝업이 차단된 것입니다.\n';
    if(isIOS()){
      msg+='아이폰: 설정 앱 → Safari → \'팝업 차단\' 끄기\n'
          +'(또는 주소창 왼쪽 aA → 웹사이트 설정 → 팝업 허용)\n'
          +'끈 뒤 아래 버튼을 다시 눌러주세요.';
      showIosAltBtn();
    }else{
      msg+='주소창의 팝업 차단 아이콘을 눌러 허용한 뒤 다시 시도해 주세요.';
    }
    gateMsgSet(msg,false);
  }, 6000);
}
function showIosAltBtn(){
  if(document.getElementById('iosAlt')) return;
  const card=document.querySelector('.gate-card');
  const b=document.createElement('button');
  b.id='iosAlt'; b.className='gbtn';
  b.style.cssText='margin-top:8px;background:#4a4a42';
  b.textContent='그래도 안 되면: 여기를 눌러 다시 시도';
  b.onclick=()=>{
    // ★ v3.0: 아이폰에서 redirect 방식은 "missing initial state" 오류를 내며
    //   실패합니다(사파리 저장소 분리 정책). 팝업 재시도만 사용합니다.
    gateMsgSet('다시 시도합니다… 팝업이 안 뜨면:\n설정 앱 → Safari → 팝업 차단을 끄고 한 번 더 눌러주세요.',true);
    signIn();

function signIn(){
  if(!auth){ gateMsgSet('연결 설정이 없습니다.',false); return; }
  const p=new firebase.auth.GoogleAuthProvider();
  // 이 기기에서 로그인한 적이 있으면 계정 선택을 건너뛰고 즉시 재로그인
  // (팝업이 떴다가 바로 닫히며 끝납니다). 처음인 기기만 계정 선택 표시.
  if(localStorage.getItem('shinwha_had_login')!=='1'){
    p.setCustomParameters({prompt:'select_account'});
  }
  gateMsgSet('구글 로그인 창을 엽니다…',true);
  loginWatchdog();
  // ★ 전 기기 팝업 우선 — 최신 크롬·사파리 모두 redirect 방식은
  //   로그인 저장이 차단되어(서드파티 저장소 정책) 증발합니다.
  auth.signInWithPopup(p).catch(e=>{
    clearTimeout(LOGIN_WATCH);
    const code=e && e.code;
    if(code==='auth/popup-closed-by-user'){
      gateMsgSet('로그인 창이 닫혔습니다. 다시 눌러주세요.',false);
    }else if(code==='auth/popup-blocked' || code==='auth/cancelled-popup-request'){
      if(isIOS()){
        gateMsgSet('팝업이 차단되었습니다.\n설정 앱 → Safari → 팝업 차단 끄기 후 다시 눌러주세요.',false);
      }else{
        // 안드로이드/PC: 차단 시에만 전체화면 방식으로 마지막 시도
        gateMsgSet('팝업이 차단되어 전체화면 로그인으로 전환합니다…\n(로그인이 유지되지 않으면 브라우저의 팝업 차단을 허용해 주세요)',true);
        auth.signInWithRedirect(p).catch(e2=>gateMsgSet('로그인 실패: '+e2.message,false));
      }
    }else gateMsgSet('로그인 실패: '+((e&&e.message)||e),false);
  });
}
function signOut(){ if(auth) auth.signOut(); }

async function onSignedIn(u){
  MYNAME=(u.displayName||String(u.email||'').split('@')[0]||'직원').trim();

  // ★ v1.17: 데이터 연결을 즉시 시작합니다 (실제 문지기는 Firebase 규칙 — UID 단위).
  //   느린 것들(설정 수신·Apps Script 권한 확인·마스터 로드)은 함수 뒷부분에서 병행.
  //   → 재접속이 1~2초 안에 열립니다.

  // 8초 넘게 못 열리면 네트워크 안내 (회사 와이파이가 실시간 연결을 막는 경우가 있음)
  setTimeout(()=>{
    if(!fbReady && ME){
      gateMsgSet('서버 연결이 늦어지고 있습니다…\n회사 와이파이가 실시간 연결을 차단하는 경우가 있습니다.\n와이파이를 끄고 LTE/5G로 한 번 열어보세요 — 그걸로 열리면 와이파이 문제입니다.',false);
    }
  }, 8000);

  // 데이터 구독 (규칙이 막으면 접속 신청 안내)
  db.ref('orders').on('value',s=>{
    fbReady=true; hideGate(); setStat(true,'실시간 연결됨');
    ORDERS=s.val()||{};
    for(const id in ORDERS){
      const o=ORDERS[id];
      if(!o || typeof o!=='object'){ delete ORDERS[id]; continue; }
      if(!Array.isArray(o.items)) o.items=[];
      if(!o.id) o.id=id;
    }
    seenHashes=new Set(Object.values(ORDERS).map(o=>o.hash).filter(Boolean));
    renderSide();
  },async err=>{
    fbReady=false; showGate();
    setStat(false,'승인 대기');
    let msg='이 계정은 아직 승인되지 않았습니다.';
    try{
      const r=await gsCall('requestAccess',{email:(u.email||'').toLowerCase(), uid:u.uid, name:(u.displayName||'')});
      if(r && r.status==='pending') msg='접속 신청이 접수되었습니다.\n대표님이 승인하면 바로 사용할 수 있습니다.';
    }catch(e){}
    document.getElementById('uidBox').style.display='';
    document.getElementById('myUid').textContent=u.uid;
    gateMsgSet(msg,false);
  });

  // 🖨 인쇄 도장 구독 — 주문노트에서 인쇄하면 즉시 반영
  db.ref('meta/printed').on('value',s2=>{ PRINTED=s2.val()||{}; renderSide(); });
  startPresence();
  startChat();
  renderWhoami(u);
  if(ALERT_ON) setTimeout(enablePush, 1500);   // 📲 알림 켠 기기는 토큰 자동 갱신

  // ── 느린 작업은 병행 (화면 진입을 막지 않음) ──
  (async()=>{
    try{
      const ss=await db.ref('meta/config').once('value');
      const c=ss.val();
      if(c && c.gsUrl && (cfg.gsUrl!==c.gsUrl || cfg.token!==c.token)){
        cfg=Object.assign({}, cfg, {gsUrl:c.gsUrl, token:c.token});
        localStorage.setItem(LS, JSON.stringify(cfg));
      }
    }catch(e){}
    try{
      const nk=await db.ref('users/'+u.uid+'/nick').once('value');
      if(nk.val()){ MYNAME=String(nk.val()).trim()||MYNAME; renderPresence(); }
      else if(!IS_RUNNER){
        const v=prompt('채팅에 표시할 이름을 입력하세요 (직원들이 알아보는 이름으로)\n한 번 정하면 이 계정에서 계속 사용됩니다', MYNAME);
        const nm=(v||'').trim().slice(0,20);
        if(nm){ MYNAME=nm; await db.ref('users/'+u.uid+'/nick').set(nm).catch(()=>{}); renderPresence(); }
      }
      // 👥 등록 직원 목록용 기록
      db.ref('users/'+u.uid).update({email:(u.email||'').toLowerCase(), name:MYNAME, lastSeen:Date.now()}).catch(()=>{});
      db.ref('users/'+u.uid+'/nick').on('value', s3=>{ const v=String(s3.val()||'').trim(); if(v && v!==MYNAME && !IS_RUNNER){ MYNAME=v; renderPresence(); } });
    }catch(e){}
    try{
      const j=await gsCall('getAccess');
      const access=j.access||{};
      IS_ADMIN = !!(access.adminUid && u.uid===access.adminUid);
      ALLOWED = IS_ADMIN || ((access.emails||[]).indexOf((u.email||'').toLowerCase())>=0);
    }catch(e){ console.warn('getAccess',e); }
    loadMaster();
    watchMasterVer();   // 📡 다른 화면의 학습을 실시간 수신
    watchAppVer();      // 🔄 새 버전 배포 감지 → 자동 새로고침
    watchUsersTasks();  // 👥 직원 목록 · ✅ 할일
    // 🛤 자동처리 화면 생존 신호 구독 (일반 화면) — 살아 있으면 내 폰은 파싱 안 함
    if(!IS_RUNNER){ db.ref('meta/runnerAlive').on('value', s2=>{ RUNNER_ALIVE=Number(s2.val()||0); }); }
    if(IS_RUNNER){
      const beat=()=>db.ref('meta/runnerAlive').set(Date.now()).catch(()=>{});
      beat(); setInterval(beat, 20*1000);
      MYNAME='🤖 자동처리'; renderPresence();
      document.title='🤖 자동처리 중 — 신화미트 주문방';
      // 백그라운드 탭은 타이머가 1분 단위로 느려지므로 30초마다 전체 재점검
      setInterval(()=>{
        for(const id in CHAT){ const m=CHAT[id]; if(m && m.status==='parsing') rescueIfStale(id, m); }
        for(const id in CHAT){ const m=CHAT[id]; if(m && m.status==='error') scheduleAutoRetry(id, m); }
      }, 30*1000);
    }
  })();
}

/* 🔄 새 버전 자동 새로고침 (v4.4)
   - 새 버전 화면이 접속하면 meta/appVer를 올림 → 옛 버전 화면들은 그 신호를 받아
     입력 중이 아닐 때 스스로 새로고침. 자동처리 화면은 즉시. */
let _reloadT=null;
function watchAppVer(){
  if(!db) return;
  // 옛 화면(v4.4~4.12)용 신호: 5로 고정 → 그 화면들은 한 번 새로고침하고 새 코드로 넘어옴
  db.ref('meta/appVer').once('value').then(s=>{ if(Number(s.val()||0)!==5) db.ref('meta/appVer').set(5).catch(()=>{}); });
  db.ref('meta/appBuild').on('value', s=>{
    const remote=Number(s.val()||0);
    if(!remote || remote<APP_BUILD){ db.ref('meta/appBuild').set(APP_BUILD).catch(()=>{}); return; }
    if(remote>APP_BUILD) scheduleReload();
  });
}
function scheduleReload(){
  if(_reloadT) return;
  const tryIt=()=>{
    const ta=document.getElementById('chatInput');
    const busy=(ta && ta.value.trim()) || document.querySelector('#msgMenuBg.on') || document.querySelector('#sendBtn[disabled]');
    if(IS_RUNNER || !busy){ location.reload(); return; }
    _reloadT=setTimeout(tryIt, 20000);   // 입력 중이면 20초 뒤 다시
  };
  _reloadT=setTimeout(tryIt, IS_RUNNER?1500:5000);
}

/* 🔔 앱을 열거나 화면에 돌아오면 쌓인 알림·아이콘 배지 정리 (v5.4) */
async function clearSysNotifs(){
  try{ if('clearAppBadge' in navigator) await navigator.clearAppBadge(); }catch(e){}
  try{
    const reg=SW_REG||(navigator.serviceWorker&&await navigator.serviceWorker.getRegistration());
    if(reg){ const ns=await reg.getNotifications(); ns.forEach(n=>n.close()); }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') clearSysNotifs(); });
window.addEventListener('focus', clearSysNotifs);
setTimeout(clearSysNotifs, 3000);

/* 📡 학습 실시간 전파 — 뭔가 학습되면 모든 화면이 마스터를 다시 읽습니다 */

async function loadMaster(){
  try{
    const j=await gsCall('getMaster');
    MASTER=j.master||{};
    LEARNED=j.learned||{perCustomer:{},global:{}};
    ALIASES=j.aliases||{};

   👥 접속인원 · 채팅 이름

function startPresence(){
  if(PRES_ON || !db || !ME) return;
  PRES_ON=true;
  const myRef=db.ref('presence/'+ME.uid);
  db.ref('.info/connected').on('value',s=>{
    if(s.val()){
      myRef.onDisconnect().remove();
      myRef.set({name:MYNAME, at:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{});
    }
  });
  db.ref('presence').on('value',s=>{ PRESENCE=s.val()||{}; renderPresence(); }, ()=>{});
  window.addEventListener('beforeunload',()=>{ try{myRef.remove();}catch(e){} });
}

/* 검색을 열면 최근 2주치 대화를 자동 로드 (없는 것만 위에 이어 붙임) */
let TWOWEEK_LOADED={};
async function ensureTwoWeeks(){
  if(!db || TWOWEEK_LOADED[CUR_ROOM.id]) return;
  TWOWEEK_LOADED[CUR_ROOM.id]=true;
  const cut=Date.now()-14*24*3600*1000;
  const oldest=Math.min(...Object.values(CHAT).map(m=>m&&m.ts||Infinity));
  if(isFinite(oldest) && oldest<=cut) return;              // 이미 2주 이상 로드됨
  const cnt=document.getElementById('searchCnt'); if(cnt) cnt.textContent='2주치 불러오는 중…';
  try{
    const ss=await roomRef().orderByChild('ts').startAt(cut).endAt(isFinite(oldest)?oldest-1:Date.now()).once('value');
    const arr=[]; ss.forEach(c=>{ if(!CHAT[c.key]) arr.push([c.key,c.val()]); });
    const box=document.getElementById('chatScroll');
    const keepH=box.scrollHeight, keepTop=box.scrollTop;
    arr.sort((a,b)=>(a[1].ts||0)-(b[1].ts||0)).reverse().forEach(([id,m])=>{
      m._room=CUR_ROOM.id; CHAT[id]=m;
      const row=document.createElement('div'); row.id='m_'+id;
      if(m.sys){ row.className='sys-row'; row.innerHTML='<div class="sys'+(m.kind==='warn'?' warn':m.kind==='err'?' err':'')+'">'+sysHtml(m)+'</div>'; }
      else{ row.className='msg-row'+((ME&&m.uid===ME.uid)?' mine':''); row.innerHTML=bubbleHtml(id,m); }
      box.insertBefore(row, box.firstChild);
    });
    box.scrollTop=keepTop+(box.scrollHeight-keepH);
    runSearch();
  }catch(e){ console.warn('2주 로드', e); if(cnt) cnt.textContent=''; }
}
function clearSearchMarks(){
  document.querySelectorAll('.msg-row.hit,.msg-row.hit-cur').forEach(e=>e.classList.remove('hit','hit-cur'));
  SEARCH_HITS=[]; SEARCH_CUR=-1;
  const c=document.getElementById('searchCnt'); if(c) c.textContent='';

function runSearch(){
  const q=(document.getElementById('searchIn').value||'').trim().toLowerCase();
  clearSearchMarks();
  if(!q) return;
  const ids=Object.keys(CHAT).filter(id=>{
    const m=CHAT[id]; if(!m||m.deleted) return false;
    const hay=((m.text||'')+' '+(m.name||'')).toLowerCase();
    return hay.indexOf(q)>=0;
  }).sort((a,b)=>(CHAT[a].ts||0)-(CHAT[b].ts||0));
  SEARCH_HITS=ids;
  ids.forEach(id=>{ const el=document.getElementById('m_'+id); if(el) el.classList.add('hit'); });

/* ── 📲 이 기기를 푸시에 등록/해제 ── */
function tokKey(t){ let h=0; const s=String(t); for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;} return 'd'+(h>>>0).toString(36); }
async function enablePush(loud){
  const say=msg=>{ if(loud) alert(msg); else console.warn(msg); };
  if(!ME || !db){ say('푸시 등록 실패: 로그인 정보가 아직 준비되지 않았습니다. 잠시 후 🔔을 껐다 다시 켜보세요.'); return; }
  if(!pushReady()){
    say('푸시 등록 실패: 푸시 구성요소를 사용할 수 없습니다.\n'+(SW_REG_ERR?('수신기 오류: '+SW_REG_ERR):'(이 브라우저가 푸시 미지원이거나 설정 누락)'));
    return;
  }
  if(!window.Notification){ say('푸시 등록 실패: 이 브라우저는 알림을 지원하지 않습니다.'); return; }
  if(Notification.permission==='denied'){
    say('푸시 등록 실패: 알림 권한이 차단되어 있습니다.\n폰 설정 → 앱 → 브라우저(Chrome/Safari) → 알림 → 허용으로 바꾼 뒤 🔔을 다시 켜세요.');
    return;
  }
  if(Notification.permission!=='granted'){ say('알림 권한 창에서 "허용"을 눌러야 등록됩니다.'); return; }
  try{
    if(!SW_REG){
      if(SW_REG_ERR){ say('푸시 등록 실패: 수신기(firebase-messaging-sw.js) 등록 오류\n'+SW_REG_ERR); return; }
      SW_REG=await Promise.race([
        navigator.serviceWorker.ready,
        new Promise((_,rej)=>setTimeout(()=>rej(new Error('수신기 준비 시간 초과 — firebase-messaging-sw.js가 같은 폴더에 있는지 확인')),8000))
      ]);
    }
    const t=await firebase.messaging().getToken({vapidKey:PUSH_VAPID, serviceWorkerRegistration:SW_REG});
    if(!t){ say('푸시 등록 실패: 토큰을 받지 못했습니다. 잠시 후 다시 시도하세요.'); return; }
    PUSH_TOKEN=t;
    await db.ref('push_tokens/'+ME.uid+'/'+tokKey(t)).set({
      token:t, at:Date.now(), name:MYNAME,
      ua:(navigator.userAgent||'').slice(0,60)
    });
    if(loud) alert('📲 이 기기가 알림에 등록되었습니다!\n이제 브라우저를 꺼도 새 주문 알림이 옵니다. (평일 07~18시)');
    console.log('📲 푸시 등록 완료');
  }catch(e){
    const em=String(e&&e.message||e);
    if(/permission|PERMISSION/i.test(em)){
      say('푸시 등록 실패: 저장 권한이 없습니다.\n대표님 승인(allow 명단) 상태를 확인해야 합니다 — 이 문구를 대표님께 보여주세요.');
    }else if(/applicationServerKey|VAPID/i.test(em)){
      say('푸시 등록 실패: 서버 키(VAPID) 불일치 — 관리자에게 문의하세요.');
    }else{
      say('푸시 등록 실패: '+em.slice(0,180));
    }
  }
}

function beep(){
  try{
    if(!AC) return;
    const t=AC.currentTime;
    [[880,0],[1245,.13]].forEach(([f,dt])=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+dt);
      g.gain.exponentialRampToValueAtTime(0.25,t+dt+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dt+0.14);
      o.connect(g); g.connect(AC.destination);
      o.start(t+dt); o.stop(t+dt+0.16);
    });
  }catch(e){}
}

  if((m.ts||0)<=BOOT_TS) return;                 // 접속 전에 온 과거 메시지 제외
  if(ME && m.uid===ME.uid) return;               // 내가 보낸 건 제외
  const quiet=isQuiet();                          // 🌙 매너타임: 소리·진동·알림 없이 조용히
  if(!quiet){
    beep();
    if(navigator.vibrate) navigator.vibrate([170,80,170]);   // 안드로이드만 동작 (아이폰 미지원)
  }

    document.title='('+UNREAD+') 신화미트 주문방';

        });
        n.onclick=()=>{ try{window.focus();}catch(e){} n.close(); };
      }catch(e){}
    }
  }
}

/* 🗂 현재 방 구독 (v4.0) */
function subscribeRoom(){
  ROOM_LISTENERS.forEach(r=>{ try{ r.off(); }catch(e){} }); ROOM_LISTENERS=[];
  for(const k in CHAT) delete CHAT[k];
  document.getElementById('chatScroll').innerHTML='';
  clearReply();
  try{ TWOWEEK_LOADED[CUR_ROOM.id]=false; }catch(e){}
  const ref=roomRef().limitToLast(200);
  const rid=CUR_ROOM.id;
  ref.on('child_added', s=>{
    const m=s.val(); if(!m) return; m._room=rid; CHAT[s.key]=m;
    appendMsg(s.key, m);
    if(CUR_ROOM.parse){
      if(IS_RUNNER && m.status==='parsing' && !m.lock && (m.ts||0)>BOOT_TS-5*60*1000){
        processMessage(s.key, m);                    // 🛤 자동처리 화면이 곧바로 처리
      }else{ rescueIfStale(s.key, m); scheduleAutoRetry(s.key, m); }
    }
    notifyNew(m);
    markRead(rid);
  });
  ref.on('child_changed', s=>{ const m=s.val(); if(!m) return; m._room=rid; CHAT[s.key]=m; updateMsg(s.key, m); if(CUR_ROOM.parse) scheduleAutoRetry(s.key, m); });
  ROOM_LISTENERS.push(ref);
  document.title=(IS_RUNNER?'🤖 자동처리 중 — ':'')+'신화미트 '+CUR_ROOM.name;
}

/* 🔁 실패 자동 재시도 — 30초→2분→5분 간격 최대 3회.
   transaction으로 여러 화면이 동시에 열려 있어도 1번만 실행됩니다.
   3회 모두 실패하면 수동([⚠ 실패·재시도])으로 넘어갑니다. */
const AUTO_RETRY_DELAYS=[30000, 120000, 300000];
const RETRY_SCHED={};
function scheduleAutoRetry(id, m){
  if(!m || m.sys || !m.text) return;
  if(m.status!=='error'){
    if(RETRY_SCHED[id]){ clearTimeout(RETRY_SCHED[id]); delete RETRY_SCHED[id]; }
    return;
  }
  const r=m.retries||0;
  if(r>=3) return;                                   // 자동은 3회까지
  if(Date.now()-(m.ts||0) > 12*3600*1000) return;    // 12시간 지난 건 수동만
  if(RETRY_SCHED[id]) return;
  RETRY_SCHED[id]=setTimeout(async()=>{
    delete RETRY_SCHED[id];
    const cur=CHAT[id];
    if(!cur || cur.status!=='error') return;
    try{
      const tok=newTok();
      const tr=await msgRef(id).transaction(c=>{
        if(!c || c.status!=='error') return;         // 다른 화면이 먼저 잡음
        c.status='parsing'; c.retries=(c.retries||0)+1; c.lock=tok; c.lockAt=Date.now();
        return c;
      });
      if(tr.committed && tr.snapshot && tr.snapshot.val()){
        await processMessage(id, tr.snapshot.val(), tok);
      }
    }catch(e){ console.warn('autoRetry', e); }
  }, AUTO_RETRY_DELAYS[Math.min(r,2)]);
}

/* 🔄 실패 메시지 재분석 — 누구든 누를 수 있고, 중복 실행은 transaction으로 방지 */
async function retryMsg(id){
  const m=CHAT[id];
  if(!m || m.sys || !m.text) return;
  try{
    const tok=newTok();
    const tr=await msgRef(id).transaction(c=>{
      if(!c || c.status!=='error') return;      // 이미 누가 재시도 중
      c.status='parsing'; c.lock=tok; c.lockAt=Date.now(); return c;
    });
    if(!tr.committed) return;
    await processMessage(id, tr.snapshot.val()||m, tok);
  }catch(e){ alert('재시도 실패: '+e.message); }
}

const UPLOAD_CACHE={};   // 이 세션에서 올린 사진의 base64 (photoId -> b64)
async function analyzeLog(msgId){
  const m=CHAT[msgId]; if(!m||!m.photo||!m.photo.id) return;
  const pid=m.photo.id;
  if(m.logDone && !confirm('이미 분석된 사진입니다. 다시 분석하면 시트에 행이 또 추가됩니다. 계속할까요?')) return;
  const btn=document.querySelector('#m_'+CSS.escape(msgId)+' button'); if(btn){ btn.disabled=true; btn.textContent='📊 읽는 중…'; }
  upShow('📊 일지를 읽는 중… (10~20초)', 40);
  try{
    let b64=UPLOAD_CACHE[pid], mime='image/jpeg';
    if(!b64){
      if(!(PHOTO_URL&&PHOTO_TOKEN)) throw new Error('사진 서버 설정이 필요합니다');
      const body=new URLSearchParams({action:'get', token:PHOTO_TOKEN, id:pid});
      const res=await fetch(PHOTO_URL,{method:'POST',body}); const j=await res.json();
      if(!j.ok) throw new Error(j.error||'사진을 가져오지 못했습니다');
      b64=j.data; mime=j.mime||mime;
    }
    const r=await gsCall('parseLog',{data:b64, mime:mime, by:MYNAME, photoId:pid, caption:(CHAT[msgId]&&CHAT[msgId].text)||''});
    if(!r.ok) throw new Error(r.error||'분석 실패');
    const lines=['📊 일지 분석 완료 — '+(r.date||'날짜?')+(r.shift?' '+r.shift:'')+(r.place?' '+r.place:'')+(r.team?' · '+r.team:'')+' · '+r.n+'행 시트 기록'];
    (r.rows||[]).slice(0,25).forEach(x=>{
      lines.push('· '+(x.origin?'('+x.origin+') ':'')+(x.item||'?')+(x.code?' ('+x.code+')':'')+' 투입 '+(x.input_kg==null?'-':x.input_kg)+(x.output_kg!=null?' → 생산 '+x.output_kg:'')+(x.note?' · '+x.note:''));
    });
    if((r.rows||[]).length>25) lines.push('…외 '+((r.rows||[]).length-25)+'행');
    lines.push('시트: '+(r.sheetUrl||''));
    await db.ref(roomOf(msgId).path).push().set({sys:1, kind:'ok', ref:msgId, ts:Date.now(), text:lines.join('\n'), by:MYNAME});
    await msgRef(msgId).update({logDone:r.n});
    upShow('✅ 시트에 '+r.n+'행 기록', 100); setTimeout(upHide, 1500);
  }catch(e){
    upHide();
    alert('일지 분석 실패: '+e.message);
  }finally{ if(btn){ btn.disabled=false; btn.textContent='📊 일지 분석 → 시트에 기록'; } }
}

/* 🔍 두 손가락 확대·이동 / 두 번 탭 — 자체 구현 */
let LB={s:1,x:0,y:0,base:null,lastTap:0,p:{}};
function lbApply(){ const img=document.getElementById('lbImg'); if(img) img.style.transform='translate('+LB.x+'px,'+LB.y+'px) scale('+LB.s+')'; }
function lbReset(){ LB.s=1; LB.x=0; LB.y=0; LB.base=null; LB.p={}; lbApply(); }
(function(){
  const body=document.querySelector('#lightbox .lb-body'); if(!body) return;
  const img=document.getElementById('lbImg');
  const pts=()=>Object.values(LB.p);
  body.addEventListener('pointerdown',e=>{
    e.preventDefault(); body.setPointerCapture(e.pointerId);
    LB.p[e.pointerId]={x:e.clientX,y:e.clientY};
    const arr=pts();
    if(arr.length===1){
      const now=Date.now();
      if(now-LB.lastTap<300){        // 두 번 탭: 2.5배 ↔ 원복
        if(LB.s>1){ lbReset(); }
        else{ const r=body.getBoundingClientRect(); const cx=e.clientX-r.left, cy=e.clientY-r.top; LB.s=2.5; LB.x=cx-(cx-LB.x)*2.5; LB.y=cy-(cy-LB.y)*2.5; lbApply(); }
        LB.lastTap=0; return;
      }
      LB.lastTap=now;
      LB.base={mode:'pan', sx:e.clientX, sy:e.clientY, x:LB.x, y:LB.y, moved:false};
    }else if(arr.length===2){
      const d=Math.hypot(arr[0].x-arr[1].x, arr[0].y-arr[1].y);
      const r=body.getBoundingClientRect();
      LB.base={mode:'pinch', d:d, s:LB.s, x:LB.x, y:LB.y, cx:(arr[0].x+arr[1].x)/2-r.left, cy:(arr[0].y+arr[1].y)/2-r.top};
    }
  });
  body.addEventListener('pointermove',e=>{
    if(!LB.p[e.pointerId]) return;
    LB.p[e.pointerId]={x:e.clientX,y:e.clientY};
    const arr=pts(); const b=LB.base; if(!b) return;
    if(b.mode==='pinch' && arr.length===2){
      const d=Math.hypot(arr[0].x-arr[1].x, arr[0].y-arr[1].y);
      const ns=Math.min(6, Math.max(1, b.s*d/b.d));
      const k=ns/b.s;
      LB.s=ns; LB.x=b.cx-(b.cx-b.x)*k; LB.y=b.cy-(b.cy-b.y)*k; lbApply();
    }else if(b.mode==='pan' && arr.length===1 && LB.s>1){
      const dx=e.clientX-b.sx, dy=e.clientY-b.sy;
      if(Math.abs(dx)>3||Math.abs(dy)>3) b.moved=true;
      LB.x=b.x+dx; LB.y=b.y+dy; lbApply();
    }
  });
  const up=e=>{
    delete LB.p[e.pointerId];
    const b=LB.base;
    if(pts().length===0){
      // 확대 안 된 상태에서 움직임 없이 탭 → 닫기 (두 번 탭 대기 시간 후)
      if(b && b.mode==='pan' && !b.moved && LB.s<=1){ setTimeout(()=>{ if(Date.now()-LB.lastTap>=300 && LB.s<=1) closeLightbox(); }, 320); }
      if(LB.s<=1.02) { LB.s=1; LB.x=0; LB.y=0; lbApply(); }
      LB.base=null;
    }else if(pts().length===1){ const a=pts()[0]; LB.base={mode:'pan', sx:a.x, sy:a.y, x:LB.x, y:LB.y, moved:true}; }
  };
  body.addEventListener('pointerup',up); body.addEventListener('pointercancel',up);
  body.addEventListener('wheel',e=>{ e.preventDefault(); const r=body.getBoundingClientRect(); const cx=e.clientX-r.left, cy=e.clientY-r.top; const ns=Math.min(6,Math.max(1, LB.s*(e.deltaY<0?1.15:0.87))); const k=ns/LB.s; LB.x=cx-(cx-LB.x)*k; LB.y=cy-(cy-LB.y)*k; LB.s=ns; if(ns===1){LB.x=0;LB.y=0;} lbApply(); },{passive:false});
  body.addEventListener('click',e=>e.stopPropagation());   // 배경 탭 닫기는 위 up 로직이 담당
})();

/* ⏪ 이 메시지가 주문노트에 반영한 것들을 되돌립니다.
   - 메시지가 통째로 만든 주문 → 휴지통
   - 기존 주문에 추가했던 품목(src 표시) → 그 품목만 제거 (품목이 다 빠지면 주문도 휴지통) */
async function rollbackMsg(msgId){
  for(const oid of Object.keys(ORDERS)){
    const o=ORDERS[oid]; if(!o) continue;
    if(o.chatMsg===msgId){
      await db.ref('trash/'+oid).set(Object.assign({}, o, {delAt:Date.now(), delBy:MYNAME, delWhy:'말풍선 삭제/수정'}));
      await db.ref('orders/'+oid).remove();
      delete ORDERS[oid];
      continue;
    }
    const its=o.items||[];
    if(its.some(it=>it && it.src===msgId)){
      const rest=its.filter(it=>!(it && it.src===msgId));
      if(!rest.length){
        await db.ref('trash/'+oid).set(Object.assign({}, o, {delAt:Date.now(), delBy:MYNAME, delWhy:'말풍선 삭제/수정'}));
        await db.ref('orders/'+oid).remove();
        delete ORDERS[oid];
      }else{
        o.items=rest; o.hash=hashOrder(o); o.ts=Date.now();
        await db.ref('orders/'+oid).update({items:rest, hash:o.hash, ts:o.ts});
      }
    }
  }
  seenHashes=new Set(Object.values(ORDERS).map(x=>x&&x.hash).filter(Boolean));
  renderSide();
}

/* ♻ 삭제된 메시지 복구 — 휴지통의 주문을 되살리고, 없으면 다시 분석 */
async function restoreMsg(id){
  const m=CHAT[id]; if(!m||!m.deleted) return;
  if(!(ME&&(m.uid===ME.uid||IS_ADMIN))){ alert('본인 메시지만 복구할 수 있습니다.'); return; }
  if(!confirm('이 메시지를 복구할까요?\n함께 삭제됐던 주문도 되살립니다.')) return;
  try{
    // 1) 휴지통에서 이 메시지가 만든 주문 복구
    const ss=await db.ref('trash').once('value'); const tr=ss.val()||{};
    const upd={}; let n=0;
    Object.keys(tr).forEach(oid=>{ const o=tr[oid]; if(o&&o.chatMsg===id){ const c=Object.assign({},o); delete c.delAt; delete c.delBy; delete c.delWhy; upd['orders/'+oid]=c; upd['trash/'+oid]=null; n++; } });
    await msgRef(id).update({deleted:null, status:(n||!roomOf(id).parse)?(m.text?'done':null):'parsing'});
    if(n){ await db.ref().update(upd); }
    // 2) 되살릴 주문이 없고(추가 품목 등) 주문방이면 → 다시 분석해 재반영
    if(!n && roomOf(id).parse && m.text){
      const tok=newTok();
      await msgRef(id).update({status:'parsing', lock:tok, lockAt:Date.now(), orders:null});
      await processMessage(id, Object.assign({}, m, {deleted:null}), tok);
    }
  }catch(e){ alert('복구 실패: '+e.message); }
}

/* 🗑 말풍선 삭제 — 주문노트 반영분도 함께 취소 */
async function delMsg(id){
  const m=CHAT[id]; if(!m||m.sys) return;
  if(!(m.uid===(ME&&ME.uid) || IS_ADMIN)){ alert('본인 메시지만 삭제할 수 있습니다.'); return; }
  if(!confirm('이 메시지를 삭제할까요?\n이 메시지로 등록된 주문·추가 품목도 주문노트에서 함께 삭제됩니다(휴지통).')) return;
  try{
    await rollbackMsg(id);
    await msgRef(id).update({deleted:1, status:null, orders:null});
  }catch(e){ alert('삭제 실패: '+e.message); }
}

let REPLY_TO=null;
const HDR_VEH=['0966','6506','1982','4232','택배','사무실','마포','방문','온라인'];
/* 미리보기: 날짜(0901/9.1)·차량 머리말 줄은 건너뛰고 거래처·내용 줄을 보여줍니다 */
function replyPreview(m){
  if(m.photo && !m.text) return '📷 사진';
  if(m.file && !m.text) return '📎 '+(m.file.name||'파일');
  const lines=String(m.text||'').split(/\n/).map(x=>x.trim()).filter(Boolean);
  const body=lines.filter(x=>!(/^\d{3,4}$/.test(x) || /^\d{1,2}[.\/]\d{1,2}\.?$/.test(x) || HDR_VEH.indexOf(x)>=0));
  const src=body.length?body:lines;
  return src.slice(0,2).join(' · ').slice(0,60);
}
function setReply(id){
  const m=CHAT[id];
  if(!m||m.sys) return;

  if(row) row.classList.add('replying');
  REPLY_TO=id;
  document.getElementById('replyTxt').innerHTML='<b>'+esc(m.name||'')+'</b>에게 답장: '+esc(replyPreview(m));
  document.getElementById('replyBar').classList.add('on');
  document.getElementById('chatInput').focus();
}

/* ---------- 전송 ---------- */
const inputEl=document.getElementById('chatInput');
// v1.8: Enter는 줄바꿈(기본 동작). 전송은 [전송] 버튼으로만 합니다.
//       여러 줄 주문(날짜/차량/거래처/품목…)을 쓰다가 실수로 나가는 것 방지.

async function sendMsg(){
  const text=inputEl.value.trim();
  if(!text) return;
  if(!fbReady){ alert('아직 서버에 연결되지 않았습니다.'); return; }
  const btn=document.getElementById('sendBtn');
  btn.disabled=true;
  // 🏷 사진에 "답장"으로 짧은 글 → 그 사진의 설명 (카톡 방식: 사진 → 답장 "9.3 오전 육절기")
  if(!CUR_ROOM.parse && REPLY_TO && CHAT[REPLY_TO] && (CHAT[REPLY_TO].photo||CHAT[REPLY_TO].file) && text.length<=40){
    const tid=REPLY_TO, tm=CHAT[tid];
    try{
      const cap=(tm.text?tm.text+' / ':'')+text.replace(/\n+/g,' ');
      await msgRef(tid).update({text:cap, labeled:1});
      fileLabel((tm.photo&&tm.photo.id)||(tm.file&&tm.file.id), text.replace(/\n+/g,' '));
      inputEl.value=''; inputEl.style.height='auto'; clearReply(); btn.disabled=false;
      if(CUR_ROOM.id==='prod' && tm.photo && /일지|마감|육절기|골절기|절기/.test(text) && !tm.logDone) setTimeout(()=>analyzeLog(tid), 600);
      return;
    }catch(e){ /* 실패하면 일반 메시지로 */ }
  }
  // 🏷 사진·파일 올린 직후(3분 내)의 짧은 글은 그 사진의 설명(거래처명)으로 붙임 — 주문방 제외
  if(!CUR_ROOM.parse && !REPLY_TO && text.length<=30 && !/\n/.test(text)){
    const ids=Object.keys(CHAT).filter(k=>CHAT[k]&&!CHAT[k].sys&&!CHAT[k].deleted).sort((x,y)=>(CHAT[x].ts||0)-(CHAT[y].ts||0));
    const lid=ids[ids.length-1], last=lid&&CHAT[lid];
    if(last && last.uid===ME.uid && (last.photo||last.file) && !last.text && Date.now()-(last.ts||0)<3*60*1000){
      try{
        await msgRef(lid).update({text:text, labeled:1});
        fileLabel((last.photo&&last.photo.id)||(last.file&&last.file.id), text);
        inputEl.value=''; inputEl.style.height='auto'; btn.disabled=false;
        if(CUR_ROOM.id==='prod' && last.photo && /일지|마감|육절기|골절기|절기/.test(text) && !last.logDone) setTimeout(()=>analyzeLog(lid), 600);
        return;
      }catch(e){ /* 실패하면 일반 메시지로 */ }
    }
  }
  const tok=newTok();
  const selfParse=CUR_ROOM.parse && !runnerAlive();   // 🛤 자동처리 화면이 살아 있으면 내가 파싱하지 않음
  const msg={uid:ME.uid, name:MYNAME, text, ts:Date.now(), status:(CUR_ROOM.parse?'parsing':null), lock:(selfParse?tok:null), lockAt:(selfParse?Date.now():null)};
  if(REPLY_TO) msg.replyTo=REPLY_TO;
  const ref=roomRef().push();
  try{
    await ref.set(msg);
  }catch(e){ alert('전송 실패: '+e.message); btn.disabled=false; return; }
  inputEl.value=''; inputEl.style.height='auto';
  const rTo=REPLY_TO; clearReply();
  btn.disabled=false;
  sendPushOut(text);                                                    // 📲 다른 기기들에 시스템 푸시
  if(selfParse) processMessage(ref.key, Object.assign({},msg,{replyTo:rTo||null}), tok);   // 자동처리 화면 없을 때만 내가 파싱
}

let UPLOADING=false;

function upHide(){ const b=document.getElementById('upBanner'); if(b) b.classList.remove('on'); }
async function sendFiles(files){
  const list=[...(files||[])]; if(!list.length || !fbReady) return;
  if(UPLOADING){ upShow('📤 아직 업로드 중입니다 — 잠시만요', 50); return; }
  UPLOADING=true;
  const btn=document.getElementById('sendBtn');
  btn.disabled=true; btn.textContent='…';
  ['camIn','photoIn'].forEach(id=>{ const el=document.getElementById(id); if(el) el.disabled=true; });
  // 입력창에 적어둔 짧은 글(거래처명 등)은 사진 설명 + 파일명 라벨로
  const ta=document.getElementById('chatInput');
  let cap='';
  if(!CUR_ROOM.parse && ta && ta.value.trim() && ta.value.trim().length<=30 && !/\n/.test(ta.value.trim())){ cap=ta.value.trim(); ta.value=''; ta.style.height='auto'; }
  try{
    let k=0;
    for(const file of list){
      k++;
      upShow('📤 업로드 중 '+k+'/'+list.length+(list.length>1?' — '+(file.name||''):''), (k-1)/list.length*100+10);
      if(file.size>12*1024*1024){ alert(file.name+' — 12MB 이하만 첨부할 수 있습니다'); continue; }
      const isImg=/^image\//.test(file.type||'');
      let msg;
      if(isImg){
        // 📸 화질 우선 방(hq)은 압축 없이 원본 그대로 (표·전표·라벨 글씨 보존)
        const b64=(CUR_ROOM.hq && file.size<=12*1024*1024) ? await fileToB64(file) : await compressImage(file);
        const r=await photoUpload(b64, file.name||'photo.jpg', cap);
        UPLOAD_CACHE[r.id]=b64;
        msg={uid:ME.uid, name:MYNAME, text:cap, photo:{id:r.id}, ts:Date.now(), status:null};
      }else{
        const b64=await fileToB64(file);
        const r=await fileUpload(b64, file.name||'file', file.type, cap);
        msg={uid:ME.uid, name:MYNAME, text:cap, file:{id:r.id, name:file.name||'file', size:file.size}, ts:Date.now(), status:null};
      }
      if(REPLY_TO){ msg.replyTo=REPLY_TO; clearReply(); }
      const ref=roomRef().push(); await ref.set(msg);
      upShow('📤 업로드 중 '+k+'/'+list.length, k/list.length*100);
      sendPushOut(isImg?'📷 사진':'📎 '+(file.name||'파일'));
      // 📊 생산방: 설명에 일지/마감 → 자동 분석
      if(isImg && CUR_ROOM.id==='prod' && /일지|마감/.test(cap||'')){ setTimeout(()=>analyzeLog(ref.key), 800); }
    }
    upShow('✅ 업로드 완료', 100); setTimeout(upHide, 1200);
  }catch(e){
    upHide();
    alert('업로드 실패: '+e.message);
  }finally{
    UPLOADING=false;
    btn.disabled=false; btn.textContent='전송';
    ['camIn','photoIn'].forEach(id=>{ const el=document.getElementById(id); if(el) el.disabled=false; });
  }
}
async function sendPhoto(input){ await sendFiles(input.files); input.value=''; }
function fileToB64(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=()=>rej(new Error('파일을 읽을 수 없습니다')); r.readAsDataURL(file); });
}
/* 드래그&드롭 · 클립보드 붙여넣기 (PC) */
(function(){
  const zone=document.getElementById('wrap')||document.body;
  let over=0;
  ['dragenter','dragover'].forEach(ev=>zone.addEventListener(ev,e=>{ if(!e.dataTransfer||![...e.dataTransfer.types].includes('Files')) return; e.preventDefault(); zone.classList.add('dropping'); }));
  ['dragleave','drop'].forEach(ev=>zone.addEventListener(ev,e=>{ zone.classList.remove('dropping'); }));
  zone.addEventListener('drop',e=>{ if(!e.dataTransfer||!e.dataTransfer.files.length) return; e.preventDefault(); sendFiles(e.dataTransfer.files); });
  document.addEventListener('paste',e=>{
    const items=[...((e.clipboardData&&e.clipboardData.items)||[])].filter(it=>it.kind==='file');
    if(!items.length) return;
    e.preventDefault();
    sendFiles(items.map(it=>it.getAsFile()).filter(Boolean));
  });
})();
function compressImage(file){
  return new Promise((res,rej)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      // v4.12: 총 화소 예산 기준 (세로로 긴 캡처도 가로 폭 유지). 6MP 이하는 원본 크기 그대로
      const MAXPIX=6000000, MAXSIDE=8000;
      let w=img.width,h=img.height;
      let r=Math.min(1, Math.sqrt(MAXPIX/(w*h)), MAXSIDE/w, MAXSIDE/h);
      if(r<1){ w=Math.round(w*r); h=Math.round(h*r); }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      const dataUrl=cv.toDataURL('image/jpeg',0.92);
      res(dataUrl.slice(dataUrl.indexOf(',')+1));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('이미지를 읽을 수 없습니다')); };
    img.src=url;
  });
}

/* ============================================================
   메시지 → 주문 생성 (주문노트 processChunk 이식, 단일 메시지판)
   글쓴이 브라우저에서 실행됩니다. 봇·상시 PC 불필요.
   ============================================================ */
/* 주문처럼 생긴 메시지인지 — 수량 단위 또는 날짜/차량 머리말 패턴 */
function looksLikeOrder(text){
  const t=String(text||'');
  if(/\d\s*(키|kg|㎏|박스|팩|봉|개|장|줄|판|마리|두|짝|박|b|p)(?![a-z가-힣])/i.test(t)) return true;
  const lines=t.split(/\n/).map(x=>x.trim()).filter(Boolean);
  const hasHead=lines.some(x=>/^\d{3,4}$/.test(x) || /^\d{1,2}[.\/]\d{1,2}\.?$/.test(x));
  return hasHead && lines.length>=3;
}

const LOCK_TTL=180*1000;   // 이 시간 안의 잠금은 남의 것으로 존중
async function processMessage(msgId, m, tok){
  if(!m.text){ return; }
  const mref=msgRef(msgId);
  tok=tok||newTok();
  // 🔒 처리 잠금 획득 — 다른 화면이 최근에 잡고 있으면 물러남
  try{
    const tr=await mref.transaction(c=>{
      if(!c) return;
      if(c.status==='done' || c.deleted) return;                                       // 이미 완료 — 재처리 금지
      if(c.lock && c.lock!==tok && c.lockAt && Date.now()-c.lockAt<LOCK_TTL) return;   // 남이 처리 중
      c.lock=tok; c.lockAt=Date.now(); return c;
    });
    if(!tr.committed){ console.log('🔒 완료됐거나 다른 화면이 처리 중 — 건너뜀', msgId); return; }
  }catch(e){ console.warn('lock',e); }
  const guard=async()=>{ try{ return (await mref.child('lock').once('value')).val()===tok; }catch(e){ return true; } };
  try{
    // 답장이면 원본 메시지가 만든 주문에서 거래처·날짜를 확정
    let forced=null;
    if(m.replyTo && CHAT[m.replyTo] && CHAT[m.replyTo].orders && CHAT[m.replyTo].orders.length){
      const oo=ORDERS[CHAT[m.replyTo].orders[0]];
      if(oo && oo.client && !oo.needClient) forced={client:oo.client, date:oo.date};
    }
    const isEdit=String(m.text||'').split(/\n/).slice(0,4).some(l=>/(^|\s)수정\s*$|^수정\s/.test(l.trim()));
    const tot=await createOrders(m.text, forced, msgId, m.name||'', isEdit, guard);
    if(tot.aborted){ console.log('🔒 처리 중 잠금 빼앗김 — 결과 버림', msgId); return; }
    const got=(tot.ids||[]).length + (tot.dup||0);
    if(!got && looksLikeOrder(m.text)){
      throw new Error('주문으로 인식하지 못했습니다 — 자동으로 다시 분석합니다');
    }
    await mref.update({status:'done', orders:tot.ids});

    // 결과를 시스템 답장으로
    let lines=[];
    tot.lines.slice(0,8).forEach(l=>lines.push(l));
    if(tot.lines.length>8) lines.push('…외 '+(tot.lines.length-8)+'건');
    if(tot.dup) lines.push('🔁 중복 '+tot.dup+'건 건너뜀 (이미 등록됨)');
    if(tot.fixed) lines.push('🔧 상품명 '+tot.fixed+'개 자동 교정');
    if(tot.trimmed) lines.push('✂ 잡음 '+tot.trimmed+'개 제외');
    if(tot.needClient) lines.push('⚠ 거래처 미확인 '+tot.needClient+'건 — 주문노트 ①-1에서 지정하세요');
    if(tot.noVeh) lines.push('🚚 차량 미지정 '+tot.noVeh+'건 — 미처리 블록에서 차량을 선택하세요 (선택하면 학습됨)');
    if(tot.newClients.length) lines.push('🆕 신규 거래처: '+tot.newClients.join(', '));
    if(!tot.ids.length && !tot.dup) lines.push('🚨 주문으로 인식하지 못했습니다 — 형식을 확인하거나 관리자에게 문의하세요');
    const kind = (!tot.ids.length && !tot.dup) ? 'err' : (tot.needClient?'warn':'');
    await db.ref('chat').push().set({sys:1, kind, ref:msgId, ts:Date.now(), text:lines.join('\n'), by:(IS_RUNNER?'🤖 자동처리':MYNAME)});

    // 학습 대기 적재
    if(tot.pending && tot.pending.length){
      gsCall('addPending',{rows:JSON.stringify(tot.pending)}).catch(()=>{});
    }
    // 의심 주문 → 대표님 텔레그램
    checkSuspicion(m, tot);
  }catch(e){
    console.error('processMessage',e);
    await mref.update({status:'error'}).catch(()=>{});
    const r=(CHAT[msgId]&&CHAT[msgId].retries)||0;
    const em=String(e.message||e);
    const isQuota=/quota|한도|429|RESOURCE_EXHAUSTED|사용량이 몰려/i.test(em);
    if(r===0){
      await db.ref('chat').push().set({sys:1, kind:isQuota?'warn':'err', ref:msgId, ts:Date.now(),
        text:isQuota
          ? '⏳ AI 사용량이 잠시 몰렸습니다 — 30초 후 자동으로 다시 분석합니다. 기다리시면 됩니다.'
          : '⚠ 분석 실패: '+em.slice(0,120)+'\n30초 후 자동으로 다시 시도합니다.'}).catch(()=>{});
    }else if(r>=3){
      await db.ref('chat').push().set({sys:1, kind:'err', ref:msgId, ts:Date.now(),
        text:'🚨 자동 재시도 3회 모두 실패했습니다.\n서버 상태를 확인하거나, 메시지의 [⚠ 실패·재시도]를 눌러 수동으로 시도하세요.'}).catch(()=>{});
    }
  }
}

async function createOrders(text, forced, msgId, senderName, isEdit, guard){
  const baseDate = forced ? forced.date : todayStr();
  const tot={ids:[], lines:[], dup:0, fixed:0, trimmed:0, needClient:0, newClients:[], pending:[], dates:[]};
  const j=await gsCall('parse',{text, baseDate});
  if(guard && !(await guard())){ tot.aborted=true; return tot; }   // 🔒 파싱 동안 잠금을 빼앗겼으면 쓰지 않음
  let parsed=j.orders||[];
  if(!parsed.length) return tot;

  // ── '추가/수정' 메시지 보정 (v1.7) ──
  // "탐나 추가 / 난곡것도2키" 같은 메시지에서 Gemini가 난곡을 새 거래처로
  // 분리하는 일이 있습니다. 추가/수정류 메시지에서는:
  //   · 마스터에 있는(아는) 거래처를 기준 주문으로 잡고
  //   · 모르는 이름의 "거래처"들은 새 거래처 등록 대신 기준 주문의 품목으로 접습니다
  //   · 접힌 품목(난곡 2키)은 그 거래처의 학습사전이 정상 교정합니다
  const isAddMsg = !!forced || /추가|수정|변경|바꿔|빼\s*주|빼줘/.test(text);
  if(isAddMsg){
    const known=[], unknown=[];
    parsed.forEach(o=>{
      const sk=matchClient(o.client);
      const exists = !!(sk && MASTER[sk]!==undefined && String(o.client||'').trim());
      (exists?known:unknown).push(o);
    });
    let primary = known[0] || null;
    if(!primary && forced){
      // 답장인데 아는 거래처가 하나도 안 잡힘 → 원본 주문의 거래처를 기준으로 생성
      primary={client:forced.client, date:forced.date, vehicle:'',
               items:[], raw:parsed.map(o=>o.raw||'').filter(Boolean).join('\n')};
      known.unshift(primary);
    }
    if(primary && unknown.length){
      let folded=0;
      unknown.forEach(o=>{
        const nm=String(o.client||'').trim();
        const its=(o.items||[]);
        if(its.length){
          its.forEach(it=>{
            const t=String(it.text||'').trim();
            const merged=(nm && t.indexOf(nm)!==0) ? (nm+' '+t).trim() : (t||nm);
            if(!merged) return;
            primary.items.push({product:(nm||it.product||''), text:merged, price:it.price||''});
            folded++;
          });
        }else if(nm){
          primary.items.push({product:nm, text:nm, price:''});
          folded++;
        }
      });
      if(folded){
        parsed=known;
        tot.lines.push('↩ 새 이름 '+unknown.length+'개를 '+String(primary.client||forced&&forced.client||'')+' 품목으로 합침 (새 거래처 아님)');
      }
    }
  }

  // 이 메시지에 나온 거래처들의 ERP 최근구매를 한 번에
  const need=[...new Set(parsed.map(o=>matchClient(o.client)).filter(c=>c && !(c in RECENT)))];
  if(need.length){
    try{
      const r=await gsCall('getRecent',{clients:JSON.stringify(need)});
      const got=r.recent||{};
      need.forEach(c=>{ RECENT[c]=got[c]||[]; });
    }catch(e){ console.warn('getRecent',e); }
  }

  for(let o of parsed){
    let sk=matchClient(o.client);
    if((!sk || !String(o.client||'').trim()) && forced){ sk=forced.client; }   // 답장 → 원본 거래처 확정
    const isNew = sk && !MASTER[sk];
    if(isNew){
      MASTER[sk]={vehicle:'',single:'',specs:[]};
      _clientIndex=null;
      tot.newClients.push(sk);
      gsCall('upsertClient',{client:sk, vehicle:'', single:''}).catch(e=>console.warn(e));
    }
    o.client=sk;
    o.date=o.date||baseDate;
    o.vehicle=normVeh(o.vehicle||matchVehicle(sk)||'미지정');
    if(!sk){ o.needClient=true; tot.needClient++; }

    // 단일품목 업체
    const single=(MASTER[sk]&&MASTER[sk].single)||'';
    if(single){
      o.items=(o.items||[]).map(it=>{
        const numMatch=(it.text||'').match(/[\d\.]+\s*(키로|킬로|kg|박스|팩|봉지|개|장|줄|판|리|두|마리|덩이|짝)?/i);
        const qty=numMatch?numMatch[0].trim():'';
        return {product:single, text:single+(qty?' '+qty:''), price:it.price||''};
      });
    }else{
      o.items=(o.items||[]).filter(it=>{
        const c=correctProduct(sk, it.product, it.text);
        if(c && c.item==='삭제' && (c.via==='거래처'||c.via==='공통')){ tot.trimmed++; return false; }
        if(!c || (c.via!=='거래처' && c.via!=='공통')){
          const kw=(it.product||'').trim();
          if(kw && kw.length>=2) tot.pending.push({client:sk, katok:kw, text:(it.text||'').slice(0,60)});
        }
        if(c && c.item!==it.product){
          it.wasProduct=it.product||'';
          it.product=c.item; it.fixed=1; it.via=c.via;
          if(c.cands && c.cands.length>1) it.cands=c.cands.map(x=>x.item);
          tot.fixed++;
        }
        return true;
      });
      if(!o.items.length) continue;
    }

    // 같은 날짜·거래처가 이미 있으면 품목만 병합 (품목 단위 중복 검사)
    const existing=sk ? Object.values(ORDERS).find(x=>x && x.date===o.date && !x.needClient && cliNorm(x.client)===cliNorm(sk)) : null;
    if(existing){
      let repl=0;
      if(isEdit){
        // ✏ "수정" 메시지: 품목명(수량·단위 제외)이 같은 기존 품목을 교체
        const nameKey=x=>String(x||'').replace(/[\s\d\.\,]+/g,'').replace(/(키로|킬로|kg|박스|팩|봉지|봉|개|장|줄|판|리|두|마리|덩이|짝|파트|p|b|ea)/gi,'').toLowerCase();
        const used=new Set();
        (o.items||[]).forEach(nit=>{
          const nk=nameKey(nit.product||nit.text||''); if(!nk) return;
          let i=(existing.items||[]).findIndex((x,ix)=>!used.has(ix)&&nameKey(x.product||x.text||'')===nk);
          if(i<0) i=(existing.items||[]).findIndex((x,ix)=>!used.has(ix)&&learnKey(x.product||x.text||'')===learnKey(nit.product||nit.text||''));
          if(i>=0){
            used.add(i);
            existing.items[i]=Object.assign({}, existing.items[i], nit, {at:Date.now(), src:msgId, edited:1});
            nit._used=1; repl++;
          }
        });
        // 기존 1품목 · 수정 1품목인데 이름이 달라도 → 통째로 교체 (예: 품목 자체를 바꾼 수정)
        const left=(o.items||[]).filter(x=>!x._used);
        if(!repl && left.length===1 && (existing.items||[]).length===1){
          existing.items[0]=Object.assign({}, existing.items[0], left[0], {at:Date.now(), src:msgId, edited:1});
          left[0]._used=1; repl++;
        }
      }
      const have=new Set((existing.items||[]).map(it=>dedupKey(o.date,sk,it.text)));
      const toAdd=(o.items||[]).filter(it=>{
        if(it._used){ delete it._used; return false; }
        const k=dedupKey(o.date,sk,it.text);
        if(have.has(k)){ tot.dup++; return false; }
        have.add(k); return true;
      });
      const shipNew=o.ship && (o.ship.phone||o.ship.addr||o.ship.name);
      if(shipNew){ existing.ship=Object.assign({}, existing.ship||{}, o.ship); }
      if(!toAdd.length && !repl && !shipNew) continue;
      toAdd.forEach(it=>{ it.at=Date.now(); it.src=msgId; });   // 출처 메시지 기록 (🆕 표시·되돌리기용)
      if(repl) tot.lines.push('✏ '+sk+' ('+mmdd(o.date)+') 품목 '+repl+'건 수정 반영');
      existing.items=(existing.items||[]).concat(toAdd);
      existing.hash=hashOrder(existing);
      existing.gapDone=false;
      existing.ts=Date.now();
      const upd={items:existing.items, hash:existing.hash, gapDone:false, ts:existing.ts};
      if(existing.ship) upd.ship=existing.ship;
      // 이미 확인방으로 넘어간 주문에 품목이 추가되면 → 다시 미처리로 되돌림 (전산 재확인 필요)
      if(existing.confirm){ upd.confirm=null; upd.confirmAt=null; upd['chk/erp']=null; existing.confirm=null; if(existing.chk) delete existing.chk.erp; }
      await db.ref('orders/'+existing.id).update(upd);
      tot.ids.push(existing.id);
      tot.dates.push(o.date);
      tot.lines.push('➕ '+sk+' ('+mmdd(o.date)+')에 '+toAdd.length+'품목 추가'+(existing.confirm===null?' — 확인방에서 미처리로 복귀':''));
      continue;
    }

    o.hash=hashOrder(o);
    if(seenHashes.has(o.hash)){ tot.dup+=(o.items||[]).length; continue; }

    o.done=false; o.ts=Date.now(); o.chatMsg=msgId; o.by=senderName;
    (o.items||[]).forEach(it=>{ if(it && !it.src) it.src=msgId; });
    const ref=db.ref('orders').push();
    o.id=ref.key;
    await ref.set(o);
    ORDERS[o.id]=o;
    seenHashes.add(o.hash);
    tot.ids.push(o.id);
    tot.dates.push(o.date);
    tot.lines.push('✅ '+(sk||'(거래처 미확인)')+' · '+mmdd(o.date)+' · '+(o.items||[]).length+'품목 → '
      +(o.vehicle==='미지정'?'🚚차량? ':o.vehicle));
    // 🔧 학습사전이 바꾼 상품명을 봇처럼 교정본으로 보여줍니다
    (o.items||[]).filter(it=>it.fixed).slice(0,4).forEach(it=>{
      tot.lines.push('   🔧 '+(it.wasProduct||it.text)+' → '+it.product);
    });
    if(o.vehicle==='미지정' && !o.needClient) tot.noVeh=(tot.noVeh||0)+1;
  }
  return tot;
}

/* ---------- 의심 주문 판정 → 대표님 텔레그램 ---------- */
function validMMDD(t){
  if(!/^\d{3,4}$/.test(t)) return false;
  const s=t.padStart(4,'0');
  const mm=Number(s.slice(0,2)), dd=Number(s.slice(2));
  return mm>=1&&mm<=12&&dd>=1&&dd<=31;
}
function checkSuspicion(m, tot){
  const reasons=[];
  const today=todayStr();
  const lim=new Date(); lim.setDate(lim.getDate()+7);
  const limStr=lim.getFullYear()+'-'+String(lim.getMonth()+1).padStart(2,'0')+'-'+String(lim.getDate()).padStart(2,'0');
  [...new Set(tot.dates)].forEach(d=>{
    if(d<today) reasons.push('지난 날짜로 주문이 잡혔습니다: '+d);
    else if(d>limStr) reasons.push('7일 넘는 먼 미래 날짜입니다: '+d);
  });
  // 이상한 숫자 머리말 (0840 처럼 월·일이 불가능한 3~4자리, 차량번호 제외)
  const lines=String(m.text||'').split(/\n/).map(s=>s.trim()).filter(Boolean).slice(0,3);
  for(const ln of lines){
    if(/^\d{3,4}$/.test(ln) && VEH_NUMS.indexOf(ln)<0 && !validMMDD(ln)){
      reasons.push('이상한 숫자 머리말: "'+ln+'" (날짜 오타 의심)'); break;
    }
    if(/[가-힣]/.test(ln)) break;
  }
  if(tot.needClient) reasons.push('거래처 미확인 '+tot.needClient+'건 (①-1 지정 필요)');
  if(!tot.ids.length && !tot.dup){
    const toks=(String(m.text||'').match(/[가-힣A-Za-z0-9]{2,}/g)||[]);
    if(toks.length>=2 || /\d/.test(m.text)) reasons.push('주문으로 인식하지 못한 메시지');
  }
  if(!reasons.length) return;

  db.ref('chat').push().set({sys:1, kind:'warn', ref:'', ts:Date.now(),
    text:'⚠ 이 주문은 확인이 필요해 보여 대표님께 알림을 보냈습니다\n· '+reasons.join('\n· ')}).catch(()=>{});
  const tg='⚠ 주문방 의심 주문\n'
    +'보낸사람: '+(m.name||'')+'\n'
    +'사유:\n· '+reasons.join('\n· ')+'\n\n'
    +'── 원문 ──\n'+String(m.text||'').slice(0,800)+'\n\n'
    +'확인: '+SITE_URL;
  gsCall('tgNotify',{text:tg}).catch(e=>console.warn('tgNotify',e));
}

/* ---------- 분석중 상태로 방치된 메시지 구조 (관리자 브라우저) ----------
   글쓴이가 전송 직후 브라우저를 닫으면 status=parsing 으로 남습니다.
   관리자 화면이 3분 지난 parsing 메시지를 transaction으로 선점해 대신 처리합니다. */
const IS_RUNNER=/[?&]runner=1/.test(location.search);   // v3.6 봇 PC 상시 화면

/* ── 🗂 방 정의 (v4.0) ── parse:true 인 방만 🤖 주문 파싱 */
const ROOMS=[
  {id:'order',  name:'주문방', icon:'💬', path:'chat',              parse:true,  hq:false},
  {id:'online', name:'온라인', icon:'🛒', path:'rooms/online/chat', parse:false, hq:true},
  {id:'prod',   name:'생산',   icon:'🏭', path:'rooms/prod/chat',   parse:false, hq:true},
  {id:'deliv',  name:'배송',   icon:'🚚', path:'rooms/deliv/chat',  parse:false, hq:true},
  {id:'io',     name:'입출고', icon:'📦', path:'rooms/io/chat',     parse:false, hq:true}
];
let CUR_ROOM=ROOMS[0];
(function(){ const m=location.search.match(/[?&]room=([a-z]+)/); if(m){ const r=ROOMS.find(x=>x.id===m[1]); if(r) CUR_ROOM=r; } if(IS_RUNNER) CUR_ROOM=ROOMS[0]; })();
function roomOf(id){ const m=CHAT[id]; const rid=(m&&m._room)||CUR_ROOM.id; return ROOMS.find(r=>r.id===rid)||CUR_ROOM; }
function roomRef(){ return db.ref(CUR_ROOM.path); }                  // 현재 방
function msgRef(id){ return db.ref(roomOf(id).path+'/'+id); }         // 메시지가 속한 방
const ORDER_ROOM=ROOMS[0];
let ROOM_LISTENERS=[], LAST_READ={}, ROOM_LAST={}, ROOM_UNREAD={};
let RUNNER_ALIVE=0;                                   // 자동처리 화면의 마지막 생존 신호
function runnerAlive(){ return !IS_RUNNER && (Date.now()-RUNNER_ALIVE)<60*1000; }
const STALE_MS=IS_RUNNER ? 60*1000 : 180*1000;  // 자동처리 화면 60초 / 일반 화면 3분 (안전망)
const APP_VER='6.7';
const APP_BUILD=607;   // 🔄 정수 빌드번호 — 배포마다 +1 (버전 비교용)   // 🔄 배포 버전 — 새 파일이 올라가면 열린 화면들이 자동 새로고침
function newTok(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
async function rescueIfStale(id, m){
  if(!m || m.sys || !m.text) return;
  if(m.status!=='parsing') return;
  const left=STALE_MS-(Date.now()-(m.lockAt||m.ts||0));
  if(left>0){
    setTimeout(()=>{ const cur=CHAT[id]; if(cur) rescueIfStale(id, cur); }, left+Math.floor(Math.random()*4000));
    return;
  }
  try{
    const tok=newTok();
    const tr=await msgRef(id).transaction(c=>{
      if(!c || c.status!=='parsing') return;
      if(c.lockAt && Date.now()-c.lockAt<STALE_MS) return;     // 아직 남이 살아서 처리 중
      c.status='retrying'; c.lock=tok; c.lockAt=Date.now(); return c;
    });
    if(!tr.committed) return;
    await processMessage(id, tr.snapshot.val()||m, tok);
  }catch(e){ console.warn('rescue',e); }
}

function myOpenTasks(){ return Object.keys(TASKS).filter(id=>TASKS[id]&&ME&&TASKS[id].to===ME.uid&&TASKS[id].status==='open'); }
function taskBlock(id, t, mine){

  let h='<div class="tk '+(t.status==='fail'?'fail':t.status==='done'?'done':'')+'"><div class="t">'+(t.kind==='notice'?'📢 ':'')+esc(t.text)+(t.groupTo?' <span style="font-size:11px;color:var(--muted);font-weight:400">['+esc(t.groupTo)+']</span>':'')+'</div>'
    +'<div class="m">'+(mine?'지시: '+esc(t.fromName||''):'대상: '+esc(t.toName||''))+' · '+when
    +(t.status==='done'?' · ✅ 완료'+(t.doneAt?' '+new Date(t.doneAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):''):'')
    +(t.status==='fail'?' · ❌ 미완료: '+esc(t.reason||''):'')
    +(t.needFb&&t.status==='open'?' · <span style="color:#1a4f9c">📝 피드백 요청</span>':'')+'</div>'
    +(t.fbText?'<div style="margin-top:5px;padding:6px 8px;background:#f4f7fc;border-radius:6px;font-size:13px;white-space:pre-wrap">📝 '+esc(t.fbText)+'</div>':'')
    +((t.fbPhotos||[]).length?'<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px">'+(t.fbPhotos||[]).map(pid=>'<img src="https://drive.google.com/thumbnail?id='+esc(pid)+'&sz=w160" onclick="openLightbox(\''+esc(pid)+'\')" style="width:58px;height:58px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer">').join('')+'</div>':'');
  if(mine && t.status==='open'){
    if(t.kind==='notice') h+='<div class="b"><button style="background:#1a4f9c;color:#fff" onclick="taskAckSeen(\''+id+'\')">👁 확인했음</button></div>';
    else h+='<div class="b"><button style="background:#1f6b3a;color:#fff" onclick="taskDone(\''+id+'\')">✅ 완료</button>'
      +'<button style="background:#f3e4e2;color:#8a1c1c" onclick="taskFail(\''+id+'\')">❌ 미완료 (사유)</button></div>';
  }
  if(!mine && ME && t.from===ME.uid){
    h+='<div class="b">'+(t.status!=='open'&&!t.ack?'<button style="background:#1f6b3a;color:#fff" onclick="taskAck(\''+id+'\')">✔ 확인</button>':'')
      +(t.status!=='open'?'<button style="background:#eee" onclick="taskReopen(\''+id+'\')">↺ 다시 열기</button>':'')
      +'<button style="background:#eee" onclick="taskDel(\''+id+'\')">🗑 삭제</button></div>';
  }
  return h+'</div>';
}
/* 확인한(ack) 지시는 한 줄로 접어 표시 — 누르면 펼침 */
const TASK_OPENED={};
function taskMini(id, t){

    +'<span style="font-size:13px">'+st+'</span><span style="flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(t.text||'')+'</span>'

async function taskAck(id){ try{ await db.ref('tasks/'+id).update({ack:1, ackAt:Date.now()}); }catch(e){} }
function renderTasks(){

  const mineDone=ids.filter(id=>TASKS[id].to===ME.uid&&TASKS[id].status!=='open').slice(0,15);
  const given=ids.filter(id=>TASKS[id].from===ME.uid).slice(0,40);

  h+=mineOpen.length?mineOpen.map(id=>taskBlock(id,TASKS[id],true)).join(''):'<div style="color:var(--muted);font-size:13px;padding:4px">없음 🎉</div>';
  if(mineDone.length) h+='<div class="tk-sec">🗂 내가 처리한 요청 (최근)</div>'+mineDone.map(id=>taskBlock(id,TASKS[id],true)).join('');
