      const done=g.filter(x=>x.status==='done'), fail=g.filter(x=>x.status==='fail'), open=g.filter(x=>x.status==='open');
      parts.push('<div class="tk" style="border-left-color:#1a4f9c"><div class="t">'+(t.kind==='notice'?'📢 ':'✅ ')+esc(t.text)+' <span style="font-size:11px;color:var(--muted);font-weight:400">['+esc(t.groupTo||'')+' '+g.length+'명]</span></div>'
        +'<div class="m">'+new Date(t.ts||0).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+' · '+(t.kind==='notice'?'확인':'완료')+' <b style="color:#1f6b3a">'+done.length+'</b> / '+g.length+(fail.length?' · ❌ '+fail.length:'')+'</div>'
        +(open.length?'<div style="font-size:12px;margin-top:4px">⏳ 미응답: '+esc(open.map(x=>x.toName).join(', '))+'</div>':'<div style="font-size:12px;color:#1f6b3a;margin-top:4px">전원 응답 완료</div>')
        +(fail.length?'<div style="font-size:12px;color:#b23b32;margin-top:2px">'+fail.map(x=>esc(x.toName)+': '+esc(x.reason||'')).join('<br>')+'</div>':'')
        +(done.filter(x=>x.fbText||(x.fbPhotos||[]).length).length?'<div style="font-size:12px;margin-top:4px">'+done.filter(x=>x.fbText||(x.fbPhotos||[]).length).map(x=>'📝 <b>'+esc(x.toName)+'</b>: '+esc(x.fbText||'')+((x.fbPhotos||[]).length?' 📷'+x.fbPhotos.length:'')).join('<br>')+'</div>':'')
        +'<div class="b"><button style="background:#eee" onclick="taskDelGroup(\''+esc(t.group)+'\')">🗑 삭제</button></div></div>');
    }else{
      parts.push(t.ack?taskMini(id,t):taskBlock(id,t,false));
    }
  });
  h+=parts.length?parts.join(''):'<div style="color:var(--muted);font-size:13px;padding:4px">없음 — 👥 직원 목록에서 [+ 요청]으로 보낼 수 있습니다</div>';

/* 대상자 접속 시 팝업 — 아직 안 본 할일이 있으면 */

      : (doneN?'🎉 이 날짜의 주문이 모두 처리되어<br>확인방으로 넘어갔습니다':'이 날짜에 미처리 주문이 없습니다');
    box.appendChild(e); return;
  }
  const g={};
  list.forEach(o=>{ const v=normVeh(o.vehicle||'미지정'); (g[v]=g[v]||[]).push(o); });

}

/* ============================================================
   ✏ 미처리 카드 직접 수정 + 학습 (v2.6)
   ============================================================ */

/* ⚖ 실측 태그 문자열 — 식별번호가 같은 박스끼리 합산, 다른 번호는 따로 (v5.11) */
function measText(it){
  const boxes=(it.boxes||[]).filter(b=>b&&(b.kg!=null&&b.kg!==''||b.tail));
  const nb=it.boxN||boxes.length;
  const f=v=>String(Math.round(v*100)/100).replace(/\.0+$/,'');
  if(!boxes.length){
    return (nb>1?nb+'박스 ':'')+(it.prodKg?f(it.prodKg)+'kg':'')+(it.prodTail?'('+it.prodTail+')':'');
  }
  const g={}; const order=[];
  boxes.forEach(b=>{ const k=b.tail||'-'; if(!g[k]){ g[k]={kg:0,n:0}; order.push(k); } g[k].kg+=(Number(b.kg)||0); g[k].n++; });
  const parts=order.map(k=>(g[k].kg?f(g[k].kg)+'kg':'')+'('+(k==='-'?'번호없음':k)+(g[k].n>1?'×'+g[k].n:'')+')');
  return (nb>1?nb+'박스 ':'')+parts.join(' · ');
}

/* ⚖ 생산 실측 입력 — 품목별 · 박스별 중량(kg)·식별번호 끝4자리 (v3.10) */
const MEAS_OPEN={}, BOX_EDIT={}, MEAS_T={};
function boxesOf(it){
  if(it && Array.isArray(it.boxes) && it.boxes.length){
    const r=it.boxes.map(b=>({kg:b.kg||'', tail:b.tail||''}));
    while(it.boxN && r.length<it.boxN) r.push({kg:'',tail:''});
    return r;
  }
  if(it && it.boxN) return Array.from({length:it.boxN},()=>({kg:'',tail:''}));
  if(it && (it.prodKg||it.prodTail)) return [{kg:it.prodKg||'', tail:it.prodTail||''}];
  return [{kg:'', tail:''}];
}
function openMeasure(id, keepState){
  const o=ORDERS[id]; if(!o) return;
  const box=document.getElementById('meas_'+id); if(!box) return;
  if(!keepState && box.style.display!=='none'){ box.style.display='none'; box.innerHTML=''; delete MEAS_OPEN[id]; delete BOX_EDIT[id]; return; }
  MEAS_OPEN[id]=true;
  if(!BOX_EDIT[id]) BOX_EDIT[id]=(o.items||[]).map(boxesOf);
  box.style.display='';
  box.style.cssText+=';margin:4px 0 7px;padding:7px 9px;background:#eef3fb;border:1px solid #b9cbe4;border-radius:6px';
  renderMeasure(id);
}
function renderMeasure(id){
  const o=ORDERS[id]; const box=document.getElementById('meas_'+id); if(!o||!box) return;
  const ed=BOX_EDIT[id];
  let h='<div style="font-size:11.5px;font-weight:800;color:#1a4f9c;margin-bottom:5px">⚖ 생산 실측 — 박스별 중량(kg) · 식별번호 끝 4자리 <span style="font-weight:400;color:var(--muted)">(입력하면 자동 저장)</span></div>';
  (o.items||[]).forEach((it,idx)=>{
    const rows=ed[idx]||[{kg:'',tail:''}];
    const sum=rows.reduce((a,b)=>a+(Number(b.kg)||0),0);
    const nbox=it.boxN||rows.length;
    h+='<div style="margin-bottom:6px;padding-bottom:4px;border-bottom:1px dashed #c9d6ea">'
      +'<div style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;margin-bottom:3px;flex-wrap:wrap"><span>'+esc(itemText(it))+'</span>'
      +'<label style="font-weight:400;color:#1a4f9c;display:flex;align-items:center;gap:4px">박스 수 <input type="number" min="1" max="99" inputmode="numeric" value="'+nbox+'" '
      +'onchange="boxSetN(\''+esc(id)+'\','+idx+',this.value)" style="width:52px;padding:5px;border:1px solid var(--line);border-radius:5px;font-size:13px;font-family:var(--mono);text-align:center"></label>'
      +(sum?'<span style="color:#1a4f9c;font-weight:400">합계 '+(Math.round(sum*100)/100)+'kg</span>':'')+'</div>';
    rows.forEach((b,bi)=>{
      h+='<div style="display:flex;gap:6px;align-items:center;margin-bottom:3px">'
        +'<span style="font-size:11px;color:var(--muted);width:26px">'+(bi+1)+'박스</span>'
        +'<input type="number" step="0.01" inputmode="decimal" placeholder="kg" value="'+esc(b.kg)+'" '
        +'oninput="boxIn(\''+esc(id)+'\','+idx+','+bi+',\'kg\',this.value)" style="width:78px;padding:6px;border:1px solid var(--line);border-radius:5px;font-size:13px;font-family:var(--mono)">'
        +'<input type="text" inputmode="numeric" maxlength="4" placeholder="끝4자리" value="'+esc(b.tail)+'" '
        +'oninput="boxIn(\''+esc(id)+'\','+idx+','+bi+',\'tail\',this.value)" style="width:72px;padding:6px;border:1px solid var(--line);border-radius:5px;font-size:13px;font-family:var(--mono)">'
        +(rows.length>1?'<span onclick="boxDel(\''+esc(id)+'\','+idx+','+bi+')" style="cursor:pointer;opacity:.6;font-size:12px">✕</span>':'')
        +'</div>';
    });
    h+='<button onclick="boxAdd(\''+esc(id)+'\','+idx+')" style="border:1px dashed #1a4f9c;background:#fff;color:#1a4f9c;border-radius:5px;padding:3px 9px;font-size:11.5px;font-weight:800;cursor:pointer">+ 박스 추가</button>'
      +'</div>';
  });
  h+='<button onclick="openMeasure(\''+esc(id)+'\')" style="border:1px solid var(--line);background:#fff;border-radius:5px;padding:4px 10px;font-size:11.5px;font-weight:800;cursor:pointer">닫기</button>';
  box.innerHTML=h;
}
function boxIn(id, idx, bi, field, val){
  const ed=BOX_EDIT[id]; if(!ed||!ed[idx]||!ed[idx][bi]) return;
  ed[idx][bi][field]= field==='tail' ? String(val||'').replace(/[^0-9]/g,'').slice(-4) : val;
  clearTimeout(MEAS_T[id]); MEAS_T[id]=setTimeout(()=>saveBoxes(id, idx), 700);
}
function boxAdd(id, idx){ const ed=BOX_EDIT[id]; if(!ed) return; (ed[idx]=ed[idx]||[]).push({kg:'',tail:''}); renderMeasure(id); }
/* 박스 수 지정 → 줄 수를 맞춤 (줄이면 값 있는 줄은 확인) */
function boxSetN(id, idx, n){
  const ed=BOX_EDIT[id]; if(!ed) return;
  n=Math.max(1, Math.min(99, parseInt(n,10)||1));
  const rows=ed[idx]=ed[idx]||[];
  if(rows.length<n){ while(rows.length<n) rows.push({kg:'',tail:''}); }
  else if(rows.length>n){
    const cut=rows.slice(n); 
    if(cut.some(b=>b.kg||b.tail) && !confirm('입력된 박스 줄이 지워집니다. 박스 수를 '+n+'로 줄일까요?')){ renderMeasure(id); return; }
    rows.length=n;
  }
  BOX_N[id]=BOX_N[id]||{}; BOX_N[id][idx]=n;
  renderMeasure(id); saveBoxes(id, idx);
}
const BOX_N={};
function boxDel(id, idx, bi){ const ed=BOX_EDIT[id]; if(!ed||!ed[idx]) return; ed[idx].splice(bi,1); if(!ed[idx].length) ed[idx]=[{kg:'',tail:''}]; renderMeasure(id); saveBoxes(id, idx); }
async function saveBoxes(id, idx){
  const o=ORDERS[id]; const ed=BOX_EDIT[id]; if(!o||!o.items||!o.items[idx]||!ed) return;
  const rows=(ed[idx]||[]).map(b=>({kg:(b.kg!==''&&Number(b.kg)>=0)?Number(b.kg):null, tail:b.tail||''}))
                          .filter(b=>b.kg!==null||b.tail);
  const items=o.items.slice();
  const it=Object.assign({}, items[idx]);
  const n=(BOX_N[id]&&BOX_N[id][idx])||(ed[idx]||[]).length||null;
  it.boxN=n;
  if(rows.length){
    it.boxes=rows.map(b=>({kg:b.kg===null?null:b.kg, tail:b.tail||null}));
    const sum=rows.reduce((a,b)=>a+(b.kg||0),0);
    it.prodKg=sum?Math.round(sum*100)/100:null;
    it.prodTail=rows.map(b=>b.tail).filter(Boolean).join('·')||null;
  }else{ it.boxes=null; it.prodKg=null; it.prodTail=null; if(!(BOX_N[id]&&BOX_N[id][idx])) it.boxN=null; }
  it.measBy=MYNAME; it.measAt=Date.now();
  items[idx]=it;
  try{
    await db.ref('orders/'+id).update({items:items});
    o.items=items;
    // 태그만 조용히 갱신 (패널은 그대로) — 카드 전체는 패널 닫을 때 다시 그림
    const box=document.getElementById('meas_'+id);
    if(box && !box.contains(document.activeElement)) renderSide();
  }catch(e){ alert('저장 실패: '+e.message); }
}

/* 📦 택배 수취인 — 복사(이름·연락처·주소·메모 탭 구분) · 수정 */
async function copyShip(id, btn){
  const o=ORDERS[id]; if(!o||!o.ship) return;
  const t=[o.ship.name||'', o.ship.phone||'', o.ship.addr||'', o.ship.memo||''].join('\t');
  try{ await navigator.clipboard.writeText(t); if(btn){ btn.textContent='복사됨 ✓'; setTimeout(()=>btn.textContent='📋 복사',1200); } }
  catch(e){ prompt('길게 눌러 복사하세요', t); }
}
async function editShip(id){
  const o=ORDERS[id]; if(!o) return;
  const sh=Object.assign({name:'',phone:'',addr:'',memo:''}, o.ship||{});
  const name=prompt('수취인 이름', sh.name); if(name===null) return;
  const phone=prompt('연락처', sh.phone); if(phone===null) return;
  const addr=prompt('주소', sh.addr); if(addr===null) return;
  const memo=prompt('요청사항 (없으면 비움)', sh.memo); if(memo===null) return;
  const ns={name:name.trim(), phone:phone.trim(), addr:addr.trim(), memo:memo.trim()};
  try{ await db.ref('orders/'+id).update({ship:ns}); o.ship=ns; renderSide(); }catch(e){ alert('저장 실패: '+e.message); }
}

/* 📅 배송 날짜 수정 — 의심 주문(먼 미래 날짜 등)을 바로잡습니다 */
async function editDate(id){
  const o=ORDERS[id]; if(!o) return;
  const v=prompt('배송 날짜를 입력하세요 (예: 0902 또는 2026-09-02)', (o.date||'').replace(/-/g,'').slice(4));
  if(v===null) return;
  const t=v.trim().replace(/[.\/\s]/g,'');
  let nd='';
  if(/^\d{4}$/.test(t)){                                     // MMDD
    const mm=t.slice(0,2), dd=t.slice(2);
    if(Number(mm)>=1&&Number(mm)<=12&&Number(dd)>=1&&Number(dd)<=31){
      const y=new Date().getFullYear();
      nd=y+'-'+mm+'-'+dd;
      // 이미 지난 날짜면 내년으로 해석 (12월에 1월 주문 등)
      const today=new Date(); today.setHours(0,0,0,0);
      if(new Date(nd) < today && (today - new Date(nd)) > 180*24*3600*1000) nd=(y+1)+'-'+mm+'-'+dd;
    }
  }else if(/^\d{8}$/.test(t)){
    nd=t.slice(0,4)+'-'+t.slice(4,6)+'-'+t.slice(6);
  }else if(/^\d{4}-\d{2}-\d{2}$/.test(v.trim())){
    nd=v.trim();
  }
  if(!nd){ alert('날짜 형식을 인식하지 못했습니다. 0902 또는 2026-09-02 형태로 입력하세요.'); return; }
  if(nd===o.date) return;
  try{
    const old=o.date;
    o.date=nd; o.hash=hashOrder(o); o.ts=Date.now();
    await db.ref('orders/'+id).update({date:nd, hash:o.hash, ts:o.ts, dateSrc:'수동수정'});

}

/* 거래처 확정: 잘못 잡힌 이름 → 별칭 학습, 학습사전으로 품목 재교정, 차량 자동 */
async function fixClient(id, name, btn){
  const o=ORDERS[id]; if(!o) return;
  if(!name){ alert('거래처명을 입력하세요.'); return; }
  if(btn){ btn.disabled=true; btn.textContent='저장중'; }
  try{
    let sk=matchClient(name);
    if(MASTER[sk]===undefined){
      if(!confirm('"'+sk+'"는 마스터에 없는 거래처입니다.\n신규 거래처로 등록할까요?')){ if(btn){btn.disabled=false;btn.textContent='저장';} return; }
      MASTER[sk]={vehicle:'', single:'', specs:[]};
      _clientIndex=null;
      gsCall('saveClient',{client:sk, vehicle:'', rows:'[]', single:''}).then(bumpMasterVer).catch(e=>console.warn('saveClient',e));
    }
    // 📚 별칭 학습: 원래 잘못 잡힌 이름이 있고, 그게 마스터의 다른 거래처가 아니면
    const wrong=String(o.client||'').trim();
    if(wrong && wrong!==sk && MASTER[wrong]===undefined && !o.needClient){
      ALIASES[wrong]=sk;
      gsCall('addAlias',{katok:wrong, client:sk}).then(bumpMasterVer).catch(e=>console.warn('addAlias',e));
    }
    // 품목을 이 거래처의 학습사전으로 재교정
    const items=(o.items||[]).map(it=>{
      const c=correctProduct(sk, it.product||it.text||'', it.text||'');
      if(c && c.item && c.item!=='삭제'){
        return Object.assign({}, it, {wasProduct:it.product||it.text, product:c.item, fixed:1});
      }
      return it;
    });
    const veh = normVeh(o.vehicle)!=='미지정' ? o.vehicle : normVeh(MASTER[sk].vehicle||'미지정');
    const upd={client:sk, needClient:null, items:items, vehicle:veh};
    await db.ref('orders/'+id).update(upd);
    Object.assign(o,{client:sk, needClient:false, items:items, vehicle:veh});
    renderSide();
  }catch(e){ alert('저장 실패: '+e.message); }
  finally{ if(btn){ btn.disabled=false; btn.textContent='저장'; } }
}

/* 품목 수정 — 바꾼 표현을 학습사전에 등록할지 선택 */
async function editItem(id, idx){
  const o=ORDERS[id]; if(!o||!o.items||!o.items[idx]) return;
  const it=o.items[idx];
  const cur=itemText(it);
  const v=prompt('품목 수정', cur);
  if(v===null) return;
  const nv=v.trim();
  if(!nv || nv===cur) return;
  const items=o.items.slice();
  items[idx]=Object.assign({}, it, {wasProduct:it.wasProduct||it.product||it.text, product:nv, text:nv, fixed:1, via:'수동수정'});
  try{
    // 📚 학습 여부: 원래 표현 → 새 이름 (그 거래처 전용)
    const orig=String(it.wasProduct||it.product||it.text||'').trim();
    if(orig && o.client && !o.needClient && learnKey(orig)!==learnKey(nv)){
      if(confirm('학습할까요?\n앞으로 '+o.client+'의 "'+orig+'" 는 자동으로 "'+nv+'" 로 바뀝니다.')){
        gsCall('addLearned',{client:o.client, katok:orig, item:nv}).then(bumpMasterVer).catch(e=>console.warn('addLearned',e));
        if(!LEARNED.perCustomer[o.client]) LEARNED.perCustomer[o.client]={};
        LEARNED.perCustomer[o.client][orig]=nv;
        LEARNED.perCustomer[o.client][learnKey(orig)]=nv;
      }
    }
    await db.ref('orders/'+id).update({items:items});
    o.items=items;
    renderSide();
  }catch(e){ alert('저장 실패: '+e.message); }
}

/* 품목 한 줄 삭제 */
async function delItem(id, idx){
  const o=ORDERS[id]; if(!o||!o.items||!o.items[idx]) return;
  const nm=itemText(o.items[idx]);
  if(!confirm('품목 "'+nm+'" 를 삭제할까요?')) return;
  const items=o.items.slice(); items.splice(idx,1);
  try{
    if(!items.length){
      if(confirm('품목이 없어졌습니다. 주문 전체를 삭제(휴지통)할까요?')){ await delOrder(id, true); return; }
    }
    await db.ref('orders/'+id).update({items:items});
    o.items=items;
    renderSide();
  }catch(e){ alert('저장 실패: '+e.message); }
}

/* 주문 삭제 → 휴지통 (주문노트 ♻에서 복구 가능) */
async function delOrder(id, skipConfirm){
  const o=ORDERS[id]; if(!o) return;
  if(!skipConfirm && !confirm((o.client||'(미지정)')+' · '+(o.date||'')+' 주문을 삭제할까요?\n(휴지통으로 이동 — 주문노트 ♻에서 복구 가능)')) return;
  try{
    await db.ref('trash/'+id).set(Object.assign({}, o, {delAt:Date.now(), delBy:MYNAME}));
    await db.ref('orders/'+id).remove();
    delete ORDERS[id];
    renderSide();
  }catch(e){ alert('삭제 실패: '+e.message); }
}

/* 🚚 미처리 블록에서 차량 지정 — 주문 반영 + 마스터 학습(setVehicle)
   같은 거래처의 다른 미지정 주문에도 함께 적용합니다. */
async function setVehicleFor(id, veh){
  const o=ORDERS[id]; if(!o) return;
  const sk=o.client;
  veh=normVeh(veh);
  try{
    // 같은 거래처의 미지정 주문 전부 적용
    const targets=Object.values(ORDERS).filter(x=>x && cliNorm(x.client)===cliNorm(sk) && normVeh(x.vehicle)==='미지정');
    for(const t of targets){
      t.vehicle=veh;
      await db.ref('orders/'+t.id).update({vehicle:veh});
    }
    // 마스터에 학습 → 다음 주문부터 자동
    MASTER[sk]=MASTER[sk]||{vehicle:'',single:'',specs:[]};
    MASTER[sk].vehicle=veh;
    gsCall('setVehicle',{client:sk, vehicle:veh})
      .then(bumpMasterVer)
      .catch(e=>alert('⚠ 차량이 마스터에 저장되지 않았습니다: '+e.message+'\n(이 주문에는 적용됐지만 다음 주문에 자동으로 안 붙을 수 있음 — 다시 시도하세요)'));
    renderSide();
  }catch(e){ alert('저장 실패: '+e.message); }
}

async function toggleChk(id, key, on){
  const o=ORDERS[id]; if(!o) return;
  if(o.needClient && on){ alert('거래처 미확인 주문은 먼저 주문노트 ①-1에서 거래처를 지정하세요.'); return; }
  // ✅ 전산처리는 확인 창 한 번 더 (실수 방지) — 확인방으로 넘어가는 작업이라
  if(key==='erp' && on){
    const items=(o.items||[]).map(it=>'  · '+itemText(it)+((it.prodKg||it.boxN)?'  ⚖'+measText(it):'')).join('\n');
    if(!confirm('전산처리 완료로 표시할까요?\n\n'+(o.client||'(미지정)')+' · '+mmdd(o.date||'')+' · '+normVeh(o.vehicle||'미지정')+'\n'+items+'\n\n확인하면 확인방으로 넘어가고 전산대조 대상이 됩니다.')) return;
  }
  o.chk=o.chk||{};
  if(on) o.chk[key]={by:MYNAME, at:Date.now()};
  else delete o.chk[key];
  const upd={}; upd['chk/'+key]= on?o.chk[key]:null;
  // 생산확인은 주문노트의 "완료" 표시와 동기화
  if(key==='prod') upd['done']=!!on;
  // ⚖ 주문확인·생산확인을 켜면 실측 입력칸 펼침 (아직 안 적은 품목이 있을 때)
  if(on && (key==='ord'||key==='prod')){
    const need=(o.items||[]).some(it=>!(it&&(it.prodKg||it.prodTail)));
    if(need) MEAS_OPEN[id]=true;
  }
  try{
    await db.ref('orders/'+id).update(upd);
    if(key==='erp' && on){
      // ★ 전산처리 체크 = 즉시 확인방으로 (전산대조 대기). 주문확인·생산확인은 기록용.
      const el=document.getElementById('oc_'+id);
      if(el) el.classList.add('gone');
      setTimeout(async()=>{
        o.confirm='wait'; o.confirmAt=Date.now(); o.erpAt=o.confirmAt;
        await db.ref('orders/'+id).update({confirm:'wait', confirmAt:o.confirmAt, erpAt:o.erpAt}).catch(()=>{});
        renderSide();
      },330);
      return;
    }
  }catch(e){ alert('저장 실패: '+e.message); }
  renderSide();
}

/* ERP 거래처 코드 매칭 — erpmap/{정규화된 거래처명} = {code, client, by, at}
   전산대조 프로그램이 다음 실행 때 이 코드를 최우선으로 써서 재대조합니다.
   한 번 매칭하면 학습되어 같은 거래처는 다음부터 자동 통과합니다. */
async function mapErpCode(id, code, btn){
  const o=ORDERS[id]; if(!o) return;
  if(!code){ alert('ERP 거래처 코드를 입력하세요.'); return; }
  if(btn){ btn.disabled=true; btn.textContent='저장중'; }
  try{
    await db.ref('erpmap/'+cliNorm(o.client)).set({code:code, client:o.client, by:MYNAME, at:Date.now()});
    // 재대조 요청: 실패 표시를 지우고 대조 대기로 되돌림 (다음 대조 실행 때 코드로 매칭)
    o.recon=null;
    await db.ref('orders/'+id).update({recon:null, reconReq:Date.now()});
    renderSide();
  }catch(e){ alert('저장 실패: '+e.message); }
  finally{ if(btn){ btn.disabled=false; btn.textContent='매칭'; } }
}

/* 🔗 품목 짝짓기 — 선택값 저장소 (화면이 다시 그려져도 선택 유지) */
const PAIR_SEL={};   // orderId -> {missIdx: erpItem}

/* 💾 선택한 짝 전부 일괄 저장:
   ① 각각 학습사전 등록 (거래처별) → 다음 입력부터 실시간 자동 교정
   ② 이 주문의 품목명 일괄 교체 (주문노트 반영)
   ③ 전부 짝지어지면 자동 통과 — 화면 갱신은 마지막에 한 번만 */
async function pairLearnAll(id, btn){
  const o=ORDERS[id]; if(!o) return;
  const psel=PAIR_SEL[id]||{};
  const miss=((o.recon&&o.recon.missItems)||[]);
  const chosen=miss.filter(m=>psel[m.i]);
  if(!chosen.length){ alert('먼저 각 품목의 ERP 품목을 드롭다운에서 선택하세요.\n(선택 안 한 줄은 남겨두고 나중에 해도 됩니다)'); return; }
  if(btn){ btn.disabled=true; btn.textContent='저장 중…'; }
  try{
    const items=(o.items||[]).slice();
    for(const m of chosen){
      const erp=psel[m.i];
      await gsCall('addLearned',{client:o.client, katok:m.name, item:erp});
      if(!LEARNED.perCustomer[o.client]) LEARNED.perCustomer[o.client]={};
      LEARNED.perCustomer[o.client][m.name]=erp;
      LEARNED.perCustomer[o.client][learnKey(m.name)]=erp;
      if(items[m.i]){
        items[m.i]=Object.assign({}, items[m.i], {wasProduct:items[m.i].product||m.name, product:erp, fixed:1, via:'짝짓기'});
      }
    }
    const remain=miss.filter(m=>!psel[m.i]);
    const upd={items:items};
    if(remain.length){
      upd['recon/missItems']=remain;
      const names=remain.map(m=>m.name);
      upd['recon/reason']='품목 짝짓기 필요: '+names.slice(0,3).join(', ')+(names.length>3?' 외 '+(names.length-3):'');
    }else{
      upd['recon/missItems']=null;
      upd['recon/status']='ok';
      upd['recon/via']='짝짓기 완료';
      upd['confirm']='done';
      upd['reconAt']=Date.now();
    }
    await db.ref('orders/'+id).update(upd);
    o.items=items;
    if(!o.recon) o.recon={};
    if(remain.length){ o.recon.missItems=remain; }
    else { o.recon.missItems=null; o.recon.status='ok'; o.confirm='done'; }
    delete PAIR_SEL[id];
    bumpMasterVer();
    renderSide();
  }catch(e){ alert('저장 실패: '+e.message); }
  finally{ if(btn){ btn.disabled=false; btn.textContent='💾 선택한 짝 모두 저장 (학습·적용)'; } }
}

/* (구버전 호환) 한 줄 짝짓기 */
async function pairLearn(id, idx, katok, erpItem, btn){
  const o=ORDERS[id]; if(!o) return;
  if(btn){ btn.disabled=true; btn.textContent='저장중'; }
  try{
    // ① 학습사전 등록
    await gsCall('addLearned',{client:o.client, katok:katok, item:erpItem});
    bumpMasterVer();
    if(!LEARNED.perCustomer[o.client]) LEARNED.perCustomer[o.client]={};
    LEARNED.perCustomer[o.client][katok]=erpItem;
    LEARNED.perCustomer[o.client][learnKey(katok)]=erpItem;
    // ② 이 주문의 품목명 교체
    const items=(o.items||[]).slice();
    if(items[idx]){
      items[idx]=Object.assign({}, items[idx], {wasProduct:items[idx].product||katok, product:erpItem, fixed:1, via:'짝짓기'});
    }
    // ③ 미매칭 목록에서 제거 — 비면 통과
    const miss=((o.recon&&o.recon.missItems)||[]).filter(m=>m.i!==idx);
    const upd={items:items};
    if(miss.length){
      upd['recon/missItems']=miss;
      const names=miss.map(m=>m.name);
      upd['recon/reason']='품목 짝짓기 필요: '+names.slice(0,3).join(', ')+(names.length>3?' 외 '+(names.length-3):'');
    }else{
      upd['recon/missItems']=null;
      upd['recon/status']='ok';
      upd['recon/via']='짝짓기 완료';
      upd['confirm']='done';
      upd['reconAt']=Date.now();
    }
    await db.ref('orders/'+id).update(upd);
    o.items=items;
    if(!o.recon) o.recon={};
    if(miss.length){ o.recon.missItems=miss; }
    else { o.recon.missItems=null; o.recon.status='ok'; o.confirm='done'; }
    renderSide();
  }catch(e){ alert('저장 실패: '+e.message); }
  finally{ if(btn){ btn.disabled=false; btn.textContent='학습·적용'; } }
}

/* ✔ 이대로 통과 — 품목 명칭 차이 등으로 대조가 못 찾았지만 사람이 확인했을 때.
   수동 통과로 표시하고 확인방에서 내립니다. */
async function passRecon(id){
  const o=ORDERS[id]; if(!o) return;
  if(!confirm(o.client+' 주문을 확인 완료(수동 통과)로 처리할까요?')) return;
  const rec=Object.assign({}, o.recon||{}, {status:'ok', via:'수동통과', by:MYNAME, at:Date.now()});
  o.recon=rec; o.confirm='done';
  await db.ref('orders/'+id).update({recon:rec, confirm:'done', reconAt:Date.now()})
    .catch(e=>alert('실패: '+e.message));
  renderSide();
}

async function undoConfirm(id){
  const o=ORDERS[id]; if(!o) return;
  if(!confirm(o.client+' 주문을 미처리로 되돌릴까요? (전산처리 체크가 해제됩니다)')) return;
  o.confirm=null; if(o.chk) delete o.chk.erp;
  await db.ref('orders/'+id).update({confirm:null, confirmAt:null, 'chk/erp':null}).catch(e=>alert('실패: '+e.message));
  PANEL_DATE=o.date;
  setSide('pend');
}

/* ============================================================
   모바일 스와이프 (채팅 ↔ 미처리 패널)
   ============================================================ */
let PAGE=0;
function goPage(p){
  PAGE=p;
  document.getElementById('wrap').classList.toggle('p1', p===1);
  document.getElementById('mnav0').classList.toggle('on', p===0);
  document.getElementById('mnav1').classList.toggle('on', p===1);
}
(function(){
  const wrap=document.getElementById('wrap');
  let x0=0,y0=0,dx=0,lock=null;
  wrap.addEventListener('touchstart',e=>{
    if(window.innerWidth>=920) return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; dx=0; lock=null;
  },{passive:true});
  wrap.addEventListener('touchmove',e=>{
    if(window.innerWidth>=920) return;
    const mx=e.touches[0].clientX-x0, my=e.touches[0].clientY-y0;
    if(lock===null && (Math.abs(mx)>12||Math.abs(my)>12)) lock=Math.abs(mx)>Math.abs(my)?'h':'v';
    if(lock==='h') dx=mx;
  },{passive:true});
  wrap.addEventListener('touchend',()=>{
    if(window.innerWidth>=920 || lock!=='h') return;
    if(dx<-55 && PAGE===0) goPage(1);
    else if(dx>55 && PAGE===1) goPage(0);
  });
})();
